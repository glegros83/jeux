<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFMP : le parcours</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1b2438; --muted:#55607a; --line:#d9dfec;
  --brand:#1f4fd8; --brand-ink:#ffffff; --accent:#f2a900;
  --good:#117a43; --good-bg:#e2f5ea; --mid:#8a5a00; --mid-bg:#fff2d6; --bad:#b3261e; --bad-bg:#fde7e5;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1524; --card:#182036; --ink:#eef1f8; --muted:#a9b3cc; --line:#2a3555;
    --brand:#6f95ff; --brand-ink:#0b1020; --accent:#ffc83d;
    --good:#6ee0a0; --good-bg:#12332a; --mid:#ffd27a; --mid-bg:#3a2d0e; --bad:#ff9a92; --bad-bg:#3b1b1a; }
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px;transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 10px rgba(20,30,60,.06)}
h1{font-size:1.7rem;line-height:1.2;margin:.2em 0 .4em}
h2{font-size:1.3rem;line-height:1.25;margin:.2em 0 .5em}
p{margin:.5em 0}
.big{font-size:3rem;line-height:1}
.muted{color:var(--muted)}
.tag{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:99px;padding:2px 12px;font-size:.8rem;font-weight:700}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:1rem;margin-top:12px}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.mid{border-color:var(--mid);background:var(--mid-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.pick{outline:3px solid var(--brand)}
.fb{border-left:6px solid var(--line);padding:10px 14px;margin:12px 0;border-radius:8px;background:var(--bg)}
.fb.good{border-color:var(--good)} .fb.mid{border-color:var(--mid)} .fb.bad{border-color:var(--bad)}
.ctx{background:var(--bg);border-radius:12px;padding:12px 14px;font-style:italic;margin-bottom:10px}
.plan li{margin:.4em 0}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pill{padding:3px 10px;border-radius:99px;border:2px solid var(--line);font-size:.8rem;font-weight:700;color:var(--muted)}
.pill.on{border-color:var(--brand);color:var(--brand)}
.pill.done{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.swipe{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepcard{background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;font-weight:700;font-size:1.15rem;margin:10px 0}
.seq{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.seq li{counter-increment:s;background:var(--bg);border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;gap:10px}
.seq li::before{content:counter(s);font-weight:800;color:var(--brand);min-width:1.4em}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.check input{width:22px;height:22px;margin-top:3px;flex:none}
.check.sel{border-color:var(--brand)}
.contract{border:3px double var(--brand);border-radius:14px;padding:18px;margin:14px 0;background:var(--bg)}
.inp{font:inherit;width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0 10px}
label.f{display:block;font-weight:700;font-size:.9rem}
.preview{max-width:100%;border:1px solid var(--line);border-radius:10px;margin-top:12px;background:#fff}
a.btn{text-decoration:none}
.footer{text-align:center;color:var(--muted);font-size:.85rem;padding:16px 16px 40px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="top-row"><span id="lvl">PFMP : le parcours</span><span id="xp"></span></div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
</div></header>
<div class="wrap"><main id="main" aria-live="polite"></main></div>
<div class="footer">Cours d'enseignement pro PMCV2 - Monsieur Le Gros</div>

<script>
/* ===== A PERSONNALISER ===== */
const CONFIG = {
  prof: "ton professeur (M. Le Gros)",
  classe: "SMRC2",   // classe pré-remplie dans le fichier final (modifiable par l'élève)
  // Texte affiché pour savoir à qui parler au lycée en cas de souci

/* ===== SITUATIONS DE DEPART ===== */
const STATUS = [
  { id:"rien", emoji:"🔍", t:"Je n'ai encore rien trouvé",

];

/* ===== NIVEAUX ===== */
const LEVELS = [
{ emoji:"📄", title:"La convention : ton ticket d'entrée",
  intro:"Sans convention signée, pas de PFMP. On vérifie que tu connais les règles du jeu.",
  items:[
  { type:"order", q:"Remets les étapes dans le bon ordre, de la recherche jusqu'au départ.",
    steps:[
      "Je trouve une entreprise qui accepte de m'accueillir",

      "Le lycée prépare la convention",
      "L'entreprise, le lycée et moi (ou mon responsable légal) signons",

    ],
    why:"Dans cet ordre : trouver, informer, préparer, signer, partir. On ne saute jamais l'étape des signatures." },
  { type:"mcq", q:"Le responsable d'un magasin te dit : « Viens lundi, on réglera les papiers plus tard. » Que fais-tu ?",
    opts:[
      { t:"Je viens lundi : il a dit que c'était bon, les papiers suivront sans problème.", pts:0, fb:"Sans convention signée, tu n'es pas officiellement en PFMP et tu n'es pas couvert(e) comme élève en cas de problème." },
      { t:"Je remercie et j'explique que je commence une fois la convention signée.", pts:2, fb:"Exactement. C'est professionnel, et ça te protège." },
      { t:"Je ne réponds plus : ça me paraît louche.", pts:0, fb:"Ce n'est pas louche : c'est juste une étape à respecter. Explique-le calmement." },
      { t:"Je viens lundi sans le dire au lycée.", pts:0, fb:"Dangereux : le lycée doit savoir où tu es. Jamais de PFMP cachée." }
    ]},
  { type:"mcq", q:"C'est quoi, un tuteur de stage ?",
    opts:[
      { t:"La personne de l'entreprise qui m'encadre au quotidien.", pts:2, fb:"Oui. C'est ta personne de référence sur place, elle t'apprend le métier." },
      { t:"Mon professeur principal, qui suit ma scolarité toute l'année.", pts:0, fb:"Non, lui c'est côté lycée. Le professeur référent suit ta PFMP depuis le lycée." },
      { t:"Un autre élève plus expérimenté.", pts:0, fb:"Non : le tuteur est un professionnel de l'entreprise." },
      { t:"Le client le plus régulier du magasin.", pts:0, fb:"Non, c'est quelqu'un de l'entreprise désigné pour t'encadrer." }
    ]},
  { type:"mcq", q:"En lycée pro, qui paie la gratification de PFMP de l'élève ?",
    opts:[
      { t:"L'entreprise qui m'accueille, comme un petit salaire", pts:0, fb:"Non : l'entreprise ne te paie pas." },
      { t:"L'État, pas l'entreprise", pts:2, fb:"Oui. L'État verse une gratification pour chaque semaine de PFMP : 50 € en Seconde, 75 € en Première et 100 € en Terminale. L'entreprise ne te paie pas." },

      { t:"Personne : une PFMP n'est jamais payée", pts:0, fb:"Si : tu es en formation, mais l'État verse une gratification par semaine." }
    ]},
  { type:"mcq", q:"Calcul : tu es en Première (75 € par semaine de PFMP) et tu fais 3 semaines de PFMP. Combien l'État te verse-t-il ?",
    opts:[
      { t:"150 €", pts:0, fb:"Ça ferait 2 semaines. Tu en fais 3." },
      { t:"225 €", pts:2, fb:"75 € × 3 semaines = 225 €. En Seconde ce serait 150 € (50 × 3), en Terminale 300 € (100 × 3)." },
      { t:"300 €", pts:0, fb:"Ça, c'est le montant en Terminale pour 3 semaines (100 × 3). En Première, c'est 75 € par semaine." },
      { t:"75 €", pts:0, fb:"C'est le montant d'une seule semaine. Multiplie par 3." }
    ]},
  { type:"mcq", q:"Deux entreprises te disent oui pour la même période. Que fais-tu ?",
    opts:[
      { t:"Je dis oui aux deux et je verrai le jour J pour choisir.", pts:0, fb:"Non : tu fais perdre du temps à une entreprise et tu abîmes ta réputation." },
      { t:"Je choisis l'une des deux et je préviens l'autre poliment.", pts:2, fb:"Oui. L'honnêteté compte, le monde professionnel est petit." },
      { t:"Je prends la première et je ne dis rien à l'autre.", pts:1, fb:"Mieux que rien, mais il faut prévenir la seconde. Un petit mail suffit." }
    ]},
  { type:"mcq", q:"Quel est le meilleur « kit du premier jour » ?",
    opts:[
      { t:"Rien de spécial : on verra bien sur place, à mon arrivée.", pts:0, fb:"Pas très rassurant pour une première impression." },
      { t:"Seulement mon téléphone : tout est dedans, y compris les contacts et les horaires.", pts:0, fb:"Et s'il n'a plus de batterie ? Note aussi les infos sur papier." },
      { t:"Convention, contact du tuteur, numéro du lycée, horaires.", pts:2, fb:"Complet : tu sais où aller, avec qui, et qui appeler en cas de souci." }
    ]}
  ]},

{ emoji:"🤝", title:"Savoir-être : ce qu'on attend de toi",
  intro:"En PFMP, on te juge autant sur ton attitude que sur ce que tu sais faire. Que ferais-tu ?",
  items:[
  { type:"mcq", ctx:"Ton réveil n'a pas sonné. Tu vas arriver avec 20 minutes de retard.", q:"Que fais-tu ?",
    opts:[
      { t:"J'arrive en courant sans rien dire : ça ne se verra pas trop du tout.", pts:0, fb:"Ça se voit, et ça donne l'image de quelqu'un de peu fiable." },
      { t:"J'envoie un SMS au tuteur pour le prévenir.", pts:1, fb:"C'est déjà mieux que rien, mais un appel est plus respectueux." },
      { t:"J'appelle l'entreprise, je m'excuse et j'indique mon arrivée.", pts:2, fb:"Le bon réflexe : tu préviens, tu assumes, tu rassures." }
    ]},
  { type:"mcq", ctx:"Un ami t'envoie des messages pendant que tu es en poste.", q:"Que fais-tu de ton téléphone ?",
    opts:[
      { t:"Je regarde vite fait derrière le comptoir : personne ne voit rien.", pts:0, fb:"Les clients et le tuteur le voient très bien." },
      { t:"Il reste dans mon sac, je le regarde à la pause.", pts:2, fb:"Oui. Pendant le travail, ton attention est pour l'entreprise et les clients." },

  { type:"mcq", ctx:"Premier jour de PFMP.", q:"Que penses-tu de ta tenue ?",
    opts:[
      { t:"Mon jogging préféré : c'est confortable pour travailler toute la journée.", pts:0, fb:"La tenue fait partie de l'image de l'entreprise." },
      { t:"Comme pour sortir le week-end.", pts:0, fb:"Reste sobre et adapté au métier." },
      { t:"Je demande s'il y a une tenue imposée et je viens soigné(e).", pts:2, fb:"Parfait : tu anticipes et tu montres du sérieux." }
    ]},
  { type:"mcq", ctx:"Ton tuteur t'explique une tâche, mais tu n'as rien compris.", q:"Que fais-tu ?",
    opts:[
      { t:"Je fais semblant d'avoir compris et je me débrouille ensuite.", pts:0, fb:"Le risque : faire une erreur. Mieux vaut demander." },

      { t:"Je reformule : « Si j'ai bien compris, je dois… ? »", pts:2, fb:"Poser une question ou reformuler montre que tu t'intéresses. C'est valorisé." }
    ]},
  { type:"mcq", ctx:"Un collègue te fait une remarque sèche devant les autres.", q:"Comment réagis-tu ?",
    opts:[

      { t:"Je quitte mon poste sans rien dire à personne.", pts:0, fb:"Quitter son poste, c'est grave. Reste, respire, parles-en ensuite." },

    ]},
  { type:"mcq", ctx:"Il n'y a plus de client, tu n'as plus rien à faire.", q:"Que fais-tu ?",
    opts:[
      { t:"Je demande s'il y a autre chose à faire, ou je range.", pts:2, fb:"Tu montres de l'initiative : c'est ce que retiennent les tuteurs." },
      { t:"Je m'assois et je sors mon téléphone : il n'y a personne.", pts:0, fb:"Mauvaise image garantie." },
      { t:"J'attends qu'on me dise quoi faire, sans bouger.", pts:1, fb:"Pas grave, mais tu peux prendre l'initiative en demandant." }
    ]}
  ]},

{ emoji:"✅", title:"Code de bonne conduite : ça se fait ou pas ?",
  intro:"Tu vois une phrase. Tu décides si ça se fait en PFMP ou non.",
  items:[
  { type:"sort", q:"Ça se fait ou ça ne se fait pas ?", labels:["✅ Ça se fait","❌ Ça ne se fait pas"],
    cards:[
      { t:"Dire bonjour à tout le monde en arrivant", ok:true, why:"Le bonjour est la base de toute relation professionnelle." },
      { t:"Tutoyer un client que je ne connais pas", ok:false, why:"On vouvoie les clients, toujours." },
      { t:"Mâcher du chewing-gum devant un client", ok:false, why:"Ça donne une image négligée." },
      { t:"Demander avant de prendre ma pause", ok:true, why:"Tu préviens, tu ne disparais pas." },
      { t:"Prendre des photos de clients ou du magasin pour les réseaux", ok:false, why:"Interdit sans autorisation : droit à l'image et confidentialité." },

{ emoji:"🚑", title:"Retards, absences et imprévus",

      { t:"Je dis que je ne suis pas formé(e) et j'en parle à {CONTACT}.", pts:2, fb:"Tu n'es jamais obligé(e) d'accepter un danger. Parle-en : tu n'es pas seul(e)." },
      { t:"Je pars sans rien dire à personne.", pts:0, fb:"Ne pars pas : explique, puis préviens le lycée." }
    ]}

{ emoji:"⭐", title:"Qualité de service : parle comme un pro",
  intro:"Tes mots font la différence. Choisis la meilleure formulation.",
  items:[

const $ = s => document.querySelector(s);
const main = $('#main');
const rep = s => s.replace('{PROF}', CONFIG.prof).replace('{CONTACT}', CONFIG.contactLycee);
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function itemMax(it){ return it.type==='mcq' ? Math.max(...it.opts.map(o=>o.pts)) : it.type==='sort' ? it.cards.length : 3; }
const TOTAL_ITEMS = LEVELS.reduce((n,l)=>n+l.items.length,0);
const MAX_XP = LEVELS.reduce((n,l)=>n+l.items.reduce((m,i)=>m+itemMax(i),0),0);
let S;
function reset(){ S = { xp:0, li:0, ii:0, done:0, status:null, lv:LEVELS.map(()=>0), eng:[], miss:[] }; }
function header(label){
  $('#lvl').textContent = label;

}
function add(p){ S.xp += p; S.lv[S.li] += p; }
function set(html){ main.innerHTML = html; window.scrollTo({top:0,behavior:'smooth'}); }
function pills(){

}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function levelEnd(){

/* ---- types d'items ---- */
function itemScreen(){
  const L = LEVELS[S.li], it = L.items[S.ii];
  header('Niveau ' + (S.li+1) + ' · question ' + (S.ii+1) + '/' + L.items.length);
  if (it.type === 'mcq') mcq(it); else if (it.type === 'sort') sortGame(it); else orderGame(it);
}
function mcq(it){
  const opts = shuffle(it.opts); const best = Math.max(...it.opts.map(o=>o.pts));
  set('<div class="card">'+pills()+(it.ctx?'<div class="ctx">'+esc(rep(it.ctx))+'</div>':'')+'<h2>'+esc(rep(it.q))+'</h2><div id="opts">' +
      opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(rep(o.t))+'</button>').join('') + '</div><div id="fb"></div></div>');
  const btns = main.querySelectorAll('.opt');
  btns.forEach(b => b.onclick = () => {
    const o = opts[+b.dataset.i]; add(o.pts); if (o.pts !== best) S.miss.push((it.ctx ? rep(it.ctx) + ' ' : '') + rep(it.q));
    btns.forEach((x,i) => { x.disabled = true; const p = opts[i].pts; x.classList.add(p === best ? 'good' : p > 0 ? 'mid' : 'bad'); });
    b.classList.add('pick');
    const cls = o.pts === best ? 'good' : o.pts > 0 ? 'mid' : 'bad';
    const head = o.pts === best ? '✅ Bonne réponse (+'+o.pts+' ⭐). ' : o.pts > 0 ? '🟡 Presque (+'+o.pts+' ⭐). ' : '❌ Pas celle-là. ';
    let extra = '';
    if (o.pts !== best) { const bo = opts.find(x=>x.pts===best); extra = '<p><b>La meilleure réponse :</b> '+esc(rep(bo.t))+'<br><span class="muted">'+esc(rep(bo.fb))+'</span></p>'; }
    $('#fb').innerHTML = '<div class="fb '+cls+'"><b>'+head+'</b>'+esc(rep(o.fb))+extra+'</div><button class="btn" id="nx">Suite</button>';
    $('#nx').onclick = next; $('#nx').focus();
  });
}
function sortGame(it){
  const cards = shuffle(it.cards); let k = 0, ok = 0;
  function show(){
    if (k >= cards.length) {
      set('<div class="card">'+pills()+'<h2>Tri terminé</h2><p><b>'+ok+' / '+cards.length+'</b> bonnes réponses.</p><button class="btn" id="nx">Suite</button></div>');
      $('#nx').onclick = next; return;
    }
    const c = cards[k];
    set('<div class="card">'+pills()+'<h2>'+esc(it.q)+'</h2><p class="muted">Carte '+(k+1)+' / '+cards.length+'</p><div class="stepcard">'+esc(c.t)+'</div>' +
        '<div class="swipe"><button class="opt" data-v="1">'+it.labels[0]+'</button><button class="opt" data-v="0">'+it.labels[1]+'</button></div><div id="fb"></div></div>');
    const btns = main.querySelectorAll('.opt');
    btns.forEach(b => b.onclick = () => {
      const val = b.dataset.v === '1'; const good = val === c.ok;
      if (good) { ok++; add(1); } else S.miss.push('Tri : « ' + c.t + ' »');
      btns.forEach(x => { x.disabled = true; });
      b.classList.add(good ? 'good' : 'bad');
      $('#fb').innerHTML = '<div class="fb '+(good?'good':'bad')+'"><b>'+(good?'✅ Bien vu (+1 ⭐). ':'❌ Pas tout à fait. ')+'</b>'+(c.ok?'Ça se fait. ':'Ça ne se fait pas. ')+esc(c.why)+'</div><button class="btn" id="nx">Carte suivante</button>';
      $('#nx').onclick = () => { k++; show(); }; $('#nx').focus();
    });
  }
  show();
}
function orderGame(it){
  const pool = shuffle(it.steps.map((t,i)=>({t,i}))); let chosen = [], tries = 0;
  function draw(msg){
    set('<div class="card">'+pills()+'<h2>'+esc(it.q)+'</h2><p class="muted">Touche les étapes dans l\'ordre. Tu peux recommencer.</p>' +
        '<h3>Ton ordre</h3><ol class="seq">'+(chosen.length?chosen.map(c=>'<li>'+esc(c.t)+'</li>').join(''):'<li class="muted">(vide)</li>')+'</ol>' +
        '<div id="pool">'+pool.filter(p=>!chosen.includes(p)).map(p=>'<button class="opt" data-i="'+p.i+'">'+esc(p.t)+'</button>').join('')+'</div>' +
        '<div id="fb">'+(msg||'')+'</div><button class="btn ghost" id="rs">Recommencer</button></div>');
    main.querySelectorAll('#pool .opt').forEach(b => b.onclick = () => {
      chosen.push(pool.find(p=>p.i===+b.dataset.i));
      if (chosen.length < pool.length) return draw();
      tries++;
      const good = chosen.every((c,i)=>c.i===i);
      if (good) {
        const pts = tries === 1 ? 3 : tries === 2 ? 2 : 1; add(pts); if (tries > 1) S.miss.push('Ordre des étapes de la convention');
        set('<div class="card">'+pills()+'<h2>✅ Bon ordre !</h2><ol class="seq">'+it.steps.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol><div class="fb good">+'+pts+' ⭐ — '+esc(it.why)+'</div><button class="btn" id="nx">Suite</button></div>');
        $('#nx').onclick = next;
      } else {
        chosen = [];
        draw('<div class="fb bad"><b>❌ Ce n\'est pas le bon ordre.</b> Réfléchis : qu\'est-ce qui doit se passer avant ? Essaie encore.</div>');
      }
    });
    $('#rs').onclick = () => { chosen = []; draw(); };
  }
  draw();
}

function rankOf(pc){
  return pc >= .85 ? ['🥇','Stagiaire modèle','Tu as les bons réflexes. Il ne reste qu\'à les appliquer sur le terrain.']
       : pc >= .65 ? ['🥈','Stagiaire solide','Tu connais l\'essentiel. Relis les points ratés avant de partir.']
       : pc >= .4  ? ['🥉','Stagiaire en progression','Pas mal pour un début. Refais le parcours en lisant bien les corrections.']
       :             ['🧭','Stagiaire à préparer','Tu as des bases à renforcer. Refais le parcours et pose tes questions à ton professeur.'];
}

function wrapText(g, txt, x, y, maxW, lh){
  const words = String(txt).split(' '); let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line){ g.fillText(line, x, y); y += lh; line = w; } else line = test;
  }
  if (line){ g.fillText(line, x, y); y += lh; }
  return y;
}
function makeCard(nom, prenom, classe){
  const W = 1000, H = 3200, L = 60, MW = W - 2*L;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,W,H); g.fillStyle = '#111'; g.textBaseline = 'alphabetic';
  let y = 80;
  const title = (txt) => { y += 28; g.font = '700 34px Arial, sans-serif'; g.fillText(txt, L, y); y += 12; g.fillRect(L, y, MW, 3); y += 40; };
  const para  = (txt, bold) => { g.font = (bold ? '700 ' : '') + '28px Arial, sans-serif'; y = wrapText(g, txt, L, y, MW, 38); };
  const bullet = (txt) => { g.font = '28px Arial, sans-serif'; g.fillText('•', L, y); y = wrapText(g, txt, L + 34, y, MW - 34, 38) + 6; };
  g.font = '700 46px Arial, sans-serif'; g.fillText('PFMP : le parcours', L, y); y += 52;
  g.font = '30px Arial, sans-serif'; g.fillText('Résultat de l\'élève', L, y); y += 24;
  g.fillRect(L, y, MW, 4); y += 50;
  para(prenom + ' ' + nom.toUpperCase(), true);
  para('Classe : ' + classe + '   •   Date : ' + new Date().toLocaleDateString('fr-FR'));
  const pc = S.xp / MAX_XP, rk = rankOf(pc);
  title('Mon score');
  para(S.xp + ' / ' + MAX_XP + ' points (' + Math.round(pc*100) + ' %) — ' + rk[1], true);
  title('Score par niveau');
  LEVELS.forEach((l,i)=>{ const mx = l.items.reduce((m,x)=>m+itemMax(x),0); bullet('Niveau ' + (i+1) + ' — ' + l.title + ' : ' + S.lv[i] + ' / ' + mx); });
  title('Où j\'en suis dans ma recherche de PFMP');
  para(S.status ? S.status.t : 'Non précisé', true);
  title('Mes 3 engagements');
  S.eng.forEach(i => bullet(ENG[i]));
  title('Points à revoir');
  if (!S.miss.length) para('Aucune erreur : bravo !');
  else { S.miss.slice(0, 10).forEach(m => bullet(m.length > 150 ? m.slice(0,147) + '…' : m)); if (S.miss.length > 10) para('… et ' + (S.miss.length - 10) + ' autre(s).'); }
  y += 40; g.font = '22px Arial, sans-serif'; g.fillText('Cours d\'enseignement pro PMCV2 - Monsieur Le Gros', L, y); y += 30;
  const o = document.createElement('canvas'); o.width = W; o.height = y; o.getContext('2d').drawImage(c, 0, 0);
  return o;
}

  header('Mon contrat de stagiaire');
  set('<div class="card"><div class="contract"><h2>📝 Mon contrat de stagiaire</h2><p>Pendant ma PFMP, je m\'engage à :</p><ol>' + S.eng.map(i=>'<li>'+esc(ENG[i])+'</li>').join('') + '</ol></div>' +
      '<h2>📤 Mon fichier pour Pronote</h2>' +
      '<p>Écris ton nom puis crée ton fichier : il contient ton score, ton avancée dans ta recherche de PFMP, tes engagements et les points à revoir. Ensuite, dépose-le sur Pronote.</p>' +
      '<label class="f">Nom<input class="inp" id="fn" autocomplete="off"></label>' +
      '<label class="f">Prénom<input class="inp" id="fp" autocomplete="off"></label>' +
      '<label class="f">Classe<input class="inp" id="fc" autocomplete="off" value="'+esc(CONFIG.classe)+'"></label>' +
      '<button class="btn" id="mk" disabled>Créer mon fichier</button><div id="out"></div></div>' +
      '<div class="card"><h2>Rappel de ton plan d\'action</h2>' + planHTML(S.status) + '<button class="btn ghost" id="again">Refaire le parcours</button></div>');
  const fn = $('#fn'), fp = $('#fp'), fc = $('#fc'), mk = $('#mk');
  const chk = () => { mk.disabled = !(fn.value.trim() && fp.value.trim() && fc.value.trim()); };
  [fn, fp, fc].forEach(x => x.oninput = chk);
  mk.onclick = () => {
    const nom = fn.value.trim(), prenom = fp.value.trim(), classe = fc.value.trim();
    const cv = makeCard(nom, prenom, classe);
    const url = cv.toDataURL('image/png');
    const clean = t => t.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    const fname = 'PFMP_' + clean(nom).toUpperCase() + '_' + clean(prenom) + '.png';
    $('#out').innerHTML = '<p><b>✅ Ton fichier est prêt.</b></p><a class="btn" id="dl" download="'+fname+'" href="'+url+'">Télécharger mon fichier</a>' +
      '<p class="muted">Fichier : '+fname+'. Si le téléchargement ne marche pas, appuie longuement sur l\'image pour l\'enregistrer, ou fais une capture d\'écran.</p><img class="preview" alt="Aperçu de mon fichier" src="'+url+'">';
  };
  $('#again').onclick = welcome;
}
welcome();
</script>
</body>
</html>
