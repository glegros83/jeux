<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Espace prof</title>
<meta name="theme-color" content="#160d2c">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea; --bg2: #e9e3d6; --ink: #1d1a2e; --muted: #625d75; --card: #ffffff;
    --line: rgba(29,26,46,.12); --accent: #ff5a36; --ok: #1f9d6b; --warn: #e08a00; --err: #d23c3c;
    --shadow: 0 2px 0 rgba(29,26,46,.9); --bar: rgba(244,241,234,.9);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15122b; --bg2: #1d1940; --ink: #f3efff; --muted: #a9a3c4; --card: #231f47;
      --line: rgba(255,255,255,.1); --shadow: 0 2px 0 rgba(0,0,0,.6); --bar: rgba(21,18,43,.9);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  .bar { position: sticky; top: 0; z-index: 10; background: var(--bar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; }
  .bar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .bar b { font-size: 18px; } .bar a, .bar button.link { margin-left: auto; color: var(--muted); font-size: 14px; font-weight: 700; }
  button.link { background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 6px; font: inherit; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 110px); }

  .panel { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  h1 { font-size: 26px; margin: 0 0 6px; } h2 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); } ol { padding-left: 20px; line-height: 1.6; }
  input[type=password], input[type=text] { width: 100%; font: 600 15px ui-monospace, Consolas, monospace; padding: 12px; border-radius: 12px;
    border: 2px solid var(--ink); background: var(--bg); color: var(--ink); margin: 8px 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--ink); border-radius: 12px; background: var(--accent);
    color: #fff; font: 800 16px system-ui, sans-serif; padding: 12px 16px; cursor: pointer; box-shadow: var(--shadow); width: 100%; }
  .btn.ghost { background: var(--card); color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { font-weight: 700; font-size: 14px; margin-top: 8px; } .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .cls { margin: 22px 0 8px; display: flex; align-items: center; gap: 10px; }
  .cls .dot { width: 14px; height: 14px; border-radius: 4px; background: var(--c); }
  .course { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }
  .item { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .item.child { margin-left: 18px; border-width: 1.5px; box-shadow: none; }
  .item.changed { outline: 3px solid var(--warn); outline-offset: 1px; }
  .item .head { display: flex; align-items: center; gap: 10px; }
  .item .em { font-size: 22px; flex: none; }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; font-size: 15px; line-height: 1.25; }
  .item .t small { color: var(--muted); font-size: 12px; }
  .item .eff { font-size: 12px; color: var(--warn); font-weight: 700; margin-top: 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 10px; background: var(--bg2); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; border-radius: 8px; padding: 9px 4px; font: 800 13px system-ui, sans-serif; background: transparent; color: var(--muted); cursor: pointer; }
  .seg button.on[data-v=ouvert] { background: var(--ok); color: #fff; }
  .seg button.on[data-v=grise] { background: var(--warn); color: #fff; }
  .seg button.on[data-v=masque] { background: var(--ink); color: var(--bg); }

  .save { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); transform: translateY(110%); transition: .25s; }
  .save.show { transform: none; }
  .save-in { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .save-in .btn { flex: 2; } .save-in .btn.ghost { flex: 1; }
  .status { max-width: 720px; margin: 0 auto 8px; font-size: 14px; font-weight: 700; text-align: center; }

  /* ===== Habillage arcade × BD (surcharge) ===== */
  :root, :root:not([data-theme="light"]) {
    --bg: #160d2c; --bg2: #e9e1cc; --ink: #0b0716; --muted: #5d5470; --card: #fff8e7;
    --line: #000; --shadow: 5px 5px 0 #000; --bar: #12092a;
    --pixel: "Press Start 2P", ui-monospace, monospace; --comic: "Bangers", Impact, sans-serif;
  }
  body {
    background-color: #160d2c; color: #fff8e7;
    background-image: radial-gradient(rgba(255,255,255,.09) 1.2px, transparent 1.7px); background-size: 14px 14px; background-attachment: fixed;
  }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); }
  .bar { background: linear-gradient(180deg, #2b1656, #0f0820); border-bottom: 4px solid #000; box-shadow: 0 4px 0 #ff3e8a; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .bar b { font: 12px/1.5 var(--pixel); color: #ffd23f; text-shadow: 3px 3px 0 #ff3e8a; }
  .bar a { color: #29d3f5; font: 9px var(--pixel); text-decoration: none; }
  .panel, .item { color: var(--ink); border: 3px solid #000; border-radius: 6px; }
  .panel { box-shadow: var(--shadow); }
  .item { box-shadow: 4px 4px 0 #000; }
  .item.child { border-width: 3px; box-shadow: 3px 3px 0 #000; }
  .panel a { color: #3b6fe0; font-weight: 700; }
  h1 { font: 38px/1 var(--comic); letter-spacing: 1px; }
  .panel h2 { font: 26px/1 var(--comic); letter-spacing: .5px; }
  input[type=password], input[type=text] { background: #fff; border: 3px solid #000; border-radius: 4px; }
  .btn { border: 3px solid #000; border-radius: 4px; font: 11px/1.4 var(--pixel); padding: 14px 16px; text-transform: uppercase; }
  .btn:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 #000; }
  .legend { color: #d6d0e6; }
  .legend b { color: #fff; }
  .cls h2 { font: 18px var(--pixel); color: #fff; text-shadow: 3px 3px 0 #000; }
  .cls .dot { width: 18px; height: 18px; border: 3px solid #000; border-radius: 2px; }
  .course { font: 9px/1.6 var(--pixel); color: #ffd23f; text-shadow: 2px 2px 0 #000; }
  .seg { border: 2px solid #000; border-radius: 4px; background: #e9e1cc; }
  .seg button { border-radius: 2px; font-weight: 800; color: #5d5470; }
  .seg button.on { box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
  .item .eff { color: #b86a00; }
  .save { background: #12092a; border-top: 4px solid #000; box-shadow: 0 -4px 0 #ff3e8a; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .status { color: #fff8e7; }
  button.link { color: #a39bbb; }

  /* ===== Onglets + lexique ===== */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 18px; }
  .tabs button { border: 3px solid #000; border-radius: 4px; background: #2a2340; color: #d6d0e6; font: 10px/1.4 var(--pixel); padding: 14px 8px; cursor: pointer; box-shadow: 4px 4px 0 #000; }
  .tabs button.on { background: #ffd23f; color: #000; }
  .tabs button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }
  .tabs .dotc { display: inline-block; background: #ff3e8a; color: #fff; border: 2px solid #000; padding: 3px 5px 2px; margin-left: 4px; }
  .lbl { display: block; font-weight: 800; font-size: 14px; margin: 10px 0 2px; }
  .legend + .lbl, .tabs + .legend + .lbl { color: #fff8e7; }
  select.inp, textarea.inp, input.inp { width: 100%; font: 600 15px system-ui, sans-serif; padding: 11px 12px; border: 3px solid #000; border-radius: 4px; background: #fff; color: #0b0716; margin: 4px 0 8px; }
  textarea.inp { resize: vertical; min-height: 84px; line-height: 1.4; }
  .lexpanel { margin-top: 8px; }
  .lexrow { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 2px dashed rgba(0,0,0,.15); }
  .lexrow:first-child { border-top: 0; padding-top: 0; }
  .lexrow.changed .lx b::after { content: " ●"; color: #e08a00; }
  .lexrow.editing { background: #fff1c2; margin: 0 -8px; padding: 10px 8px; border-radius: 6px; }
  .lx { flex: 1; min-width: 0; }
  .lx b { display: block; font-size: 16px; }
  .lx span { display: block; font-size: 14px; line-height: 1.4; }
  .lx i { display: block; font-size: 13px; color: #5d5470; margin-top: 2px; }
  .lxb { display: flex; gap: 6px; flex: none; }
  .mini { width: 40px; height: 40px; border: 2px solid #000; border-radius: 4px; background: #fff; cursor: pointer; font-size: 17px; box-shadow: 2px 2px 0 #000; }
  .mini:active { transform: translate(2px, 2px); box-shadow: none; }
  .row2 { display: flex; gap: 10px; margin-top: 6px; }
  .row2 .btn { flex: 1; }
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><b>🔧 Espace prof</b><a href="index.html">Voir le site ›</a></div></header>
<main id="app"></main>
<div class="save" id="save">
  <div class="status" id="status"></div>
  <div class="save-in"><button class="btn ghost" id="cancel">Annuler</button><button class="btn" id="publish">Publier</button></div>
</div>

<script src="catalogue.js"></script>
<script>
  const OWNER = "glegros83", REPO = "jeux", BRANCH = "main";
  const API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/";
  const TOKEN_KEY = "salle-admin-token";
  const { CLASSES, SEQUENCES, RESSOURCES } = window.CATALOGUE;
  const A = window.ACCES;
  const LABELS = { ouvert: "Ouvert", grise: "À venir", masque: "Masqué" };
  const TYPE_EM = { jeu: "🎮", quiz: "🧠", fiche: "📄", cours: "📖" };

  const app = document.getElementById("app");
  const saveBar = document.getElementById("save"), statusEl = document.getElementById("status");
  function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
  function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function b64decode(b) { const bin = atob(b.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
  function b64encode(s) { const bytes = new TextEncoder().encode(s); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }
  const clone = (o) => JSON.parse(JSON.stringify(o));

  /* Deux fichiers gérés : les accès et le lexique */
  const FILES = {
    etat:    { path: "etat.json",    msg: "Espace prof : mise à jour des accès",  saved: null, draft: null, sha: null },
    lexique: { path: "lexique.json", msg: "Espace prof : mise à jour du lexique", saved: null, draft: null, sha: null },
  };
  let tab = "acces";
  try { tab = sessionStorage.getItem("admin-tab") || "acces"; } catch (e) {}

  async function gh(path, method, body) {
    const r = await fetch(API + path + (method === "GET" ? "?ref=" + BRANCH + "&t=" + Date.now() : ""), {
      method, cache: "no-store",
      headers: { "Authorization": "Bearer " + getToken(), "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return r.json();
  }

  /* ---------- Connexion ---------- */
  function loginView(err) {
    saveBar.classList.remove("show");
    app.innerHTML =
      '<div class="panel"><h1>Connexion</h1><p class="muted">Cette page permet d\'ouvrir, griser ou masquer les séquences et activités, et de gérer le lexique. Elle utilise une <b>clé d\'accès GitHub</b>, à coller une seule fois sur cet appareil.</p>' +
      '<input type="password" id="tok" placeholder="github_pat_…" autocomplete="off" spellcheck="false">' +
      '<button class="btn" id="go">Se connecter</button>' +
      (err ? '<div class="msg err">' + esc(err) + '</div>' : '') + '</div>' +
      '<div class="panel"><h2>Créer la clé (une seule fois)</h2><ol>' +
        '<li>Ouvrir <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Fine-grained token</a></li>' +
        '<li><b>Token name</b> : <i>Salle de jeux admin</i></li>' +
        '<li><b>Resource owner</b> : <b>glegros83</b></li>' +
        '<li><b>Expiration</b> : la date de fin d\'année scolaire</li>' +
        '<li><b>Repository access</b> : <i>Only select repositories</i> → <b>jeux</b></li>' +
        '<li><b>Permissions</b> : cliquer <i>+ Add permissions</i>, cocher <b>Contents</b>, puis choisir <b>Read and write</b> (<i>Metadata</i> s’ajoute tout seul, c’est normal)</li>' +
        '<li><b>Generate token</b>, copier la clé <b>tout de suite</b> (elle ne s’affiche qu’une fois) et la coller ici.</li>' +
      '</ol><p class="muted">La clé reste uniquement dans ce navigateur : pour gérer depuis le PC et le téléphone, collez la même clé sur chacun. Ne la donnez à personne. Si le téléphone est perdu, supprimez-la sur github.com.</p></div>';
    document.getElementById("go").onclick = async () => {
      const t = document.getElementById("tok").value.trim();
      if (!t) return;
      setToken(t);
      load();
    };
  }

  async function loadFile(key, empty) {
    const F = FILES[key];
    try {
      const f = await gh(F.path, "GET");
      F.sha = f.sha; F.saved = JSON.parse(b64decode(f.content));
    } catch (e) {
      if (e.status === 404 && key !== "etat") { F.sha = null; F.saved = empty; }
      else throw e;
    }
    F.draft = clone(F.saved);
  }

  async function load() {
    if (!getToken()) return loginView();
    app.innerHTML = '<div class="panel">Chargement…</div>';
    try {
      await loadFile("etat");
      FILES.etat.saved.sequences = FILES.etat.saved.sequences || {}; FILES.etat.saved.ressources = FILES.etat.saved.ressources || {};
      FILES.etat.draft = clone(FILES.etat.saved);
      await loadFile("lexique", { mots: [] });
      FILES.lexique.saved.mots = FILES.lexique.saved.mots || []; FILES.lexique.draft = clone(FILES.lexique.saved);
      render();
    } catch (e) {
      setToken("");
      loginView(e.status === 401 ? "Clé refusée par GitHub (invalide ou expirée)." :
                e.status === 404 ? "Clé sans accès au dépôt « jeux » : vérifiez « Repository access » et « Contents »." :
                "Impossible de joindre GitHub (" + e.message + ").");
    }
  }

  /* ---------- Comptage des changements ---------- */
  function etatChanges() {
    const d = FILES.etat.draft, s = FILES.etat.saved; let n = 0;
    for (const q of SEQUENCES) if (A.seqState(d, q) !== A.seqState(s, q)) n++;
    for (const r of RESSOURCES) if (A.resOwnState(d, r) !== A.resOwnState(s, r)) n++;
    return n;
  }
  function lexChanges() {
    const a = new Map(FILES.lexique.saved.mots.map(w => [w.id, JSON.stringify(w)]));
    const b = new Map(FILES.lexique.draft.mots.map(w => [w.id, JSON.stringify(w)]));
    let n = 0;
    b.forEach((v, k) => { if (a.get(k) !== v) n++; });
    a.forEach((v, k) => { if (!b.has(k)) n++; });
    return n;
  }

  /* ---------- Rendu général ---------- */
  function render() {
    const y = window.scrollY;
    const ne = etatChanges(), nl = lexChanges();
    app.innerHTML = '<div class="tabs">' +
      '<button type="button" data-t="acces" class="' + (tab === "acces" ? "on" : "") + '">🔓 Accès' + (ne ? ' <span class="dotc">' + ne + '</span>' : '') + '</button>' +
      '<button type="button" data-t="lexique" class="' + (tab === "lexique" ? "on" : "") + '">📖 Lexique' + (nl ? ' <span class="dotc">' + nl + '</span>' : '') + '</button></div>';
    app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      tab = b.dataset.t; try { sessionStorage.setItem("admin-tab", tab); } catch (e) {}
      render(); window.scrollTo(0, 0);
    });
    if (tab === "lexique") renderLexique(); else renderAcces();
    app.insertAdjacentHTML("beforeend", '<p style="text-align:center;margin-top:28px"><button class="link" id="logout">Se déconnecter de cet appareil</button></p>');
    document.getElementById("logout").onclick = () => { if (confirm("Oublier la clé GitHub sur cet appareil ?")) { setToken(""); loginView(); } };
    window.scrollTo(0, y);

    const n = ne + nl;
    saveBar.classList.toggle("show", n > 0 || !!statusEl.textContent);
    const pb = document.getElementById("publish");
    pb.textContent = n ? "Publier (" + n + ")" : "Publier";
    pb.disabled = n === 0;
  }

  /* ---------- Onglet Accès ---------- */
  function seg(cur, onPick) {
    const d = document.createElement("div"); d.className = "seg";
    for (const v of ["ouvert", "grise", "masque"]) {
      const b = document.createElement("button"); b.type = "button"; b.dataset.v = v; b.textContent = LABELS[v];
      if (v === cur) b.classList.add("on");
      b.onclick = () => onPick(v);
      d.appendChild(b);
    }
    return d;
  }
  function item({ em, title, sub, cur, changed, child, eff, onPick }) {
    const d = document.createElement("div");
    d.className = "item" + (child ? " child" : "") + (changed ? " changed" : "");
    d.innerHTML = '<div class="head"><span class="em">' + em + '</span><div class="t"><b>' + esc(title) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div></div>';
    d.appendChild(seg(cur, onPick));
    if (eff) d.insertAdjacentHTML("beforeend", '<div class="eff">' + esc(eff) + '</div>');
    return d;
  }
  function setSeq(key, v) { FILES.etat.draft.sequences[key] = v; render(); }
  function setRes(id, v) { const r = FILES.etat.draft.ressources; if (v === "ouvert") delete r[id]; else r[id] = v; render(); }
  function resItem(r, loose) {
    const d = FILES.etat.draft, own = A.resOwnState(d, r), eff = A.resState(d, r);
    return item({ em: TYPE_EM[r.type] || "•", title: r.title, sub: r.type.charAt(0).toUpperCase() + r.type.slice(1), cur: own, child: !loose,
      changed: own !== A.resOwnState(FILES.etat.saved, r),
      eff: eff !== own ? "→ " + LABELS[eff] + " pour les élèves, car la séquence est « " + LABELS[eff] + " »" : "",
      onPick: v => setRes(r.id, v) });
  }
  function renderAcces() {
    const d = FILES.etat.draft, s = FILES.etat.saved;
    app.insertAdjacentHTML("beforeend", '<p class="legend"><span>🟢 <b>Ouvert</b> : visible et accessible</span><span>🟠 <b>À venir</b> : visible, grisé</span><span>⚫ <b>Masqué</b> : invisible</span></p>');
    for (const c of CLASSES) {
      app.insertAdjacentHTML("beforeend", '<div class="cls" style="--c:' + c.color + '"><span class="dot"></span><h2>' + esc(c.name) + '</h2></div>');
      for (const k of c.courses) {
        const seqs = SEQUENCES.filter(q => q.cls === c.id && q.course === k.id);
        const loose = RESSOURCES.filter(r => r.cls === c.id && r.course === k.id && !r.seq);
        app.insertAdjacentHTML("beforeend", '<div class="course">' + esc(k.name + (k.name === "Enseignement pro" ? " · " + k.sub : "")) + '</div>');
        if (!seqs.length && !loose.length) { app.insertAdjacentHTML("beforeend", '<p class="muted" style="font-size:14px;margin:0 0 8px">Rien pour l\'instant.</p>'); continue; }
        for (const q of seqs) {
          const key = A.seqKey(q), cur = A.seqState(d, q);
          app.appendChild(item({ em: q.emoji, title: q.name, sub: "Séquence", cur, changed: cur !== A.seqState(s, q), onPick: v => setSeq(key, v) }));
          for (const r of RESSOURCES.filter(r => r.cls === c.id && r.course === k.id && r.seq === q.id)) app.appendChild(resItem(r));
        }
        for (const r of loose) app.appendChild(resItem(r, true));
      }
    }
  }

  /* ---------- Onglet Lexique ---------- */
  // Un mot est rattaché à une séquence (seq) ou à une activité hors séquence (res)
  function places() {
    const out = [];
    for (const c of CLASSES) for (const k of c.courses) {
      const kn = k.name === "Enseignement pro" ? k.sub : k.name;
      for (const q of SEQUENCES.filter(q => q.cls === c.id && q.course === k.id))
        out.push({ v: "seq:" + A.seqKey(q), cls: c.id, label: c.name + " · " + kn + " · " + q.emoji + " " + q.name });
      for (const r of RESSOURCES.filter(r => r.cls === c.id && r.course === k.id && !r.seq))
        out.push({ v: "res:" + r.id, cls: c.id, label: c.name + " · " + kn + " · " + r.emoji + " " + r.title });
    }
    return out;
  }
  const placeOf = (w) => w.seq ? "seq:" + w.seq : w.res ? "res:" + w.res : "";
  let curPlace = null, editId = null;
  try { curPlace = sessionStorage.getItem("admin-place"); } catch (e) {}

  function renderLexique() {
    const P = places();
    if (!P.find(p => p.v === curPlace)) curPlace = P.length ? P[0].v : null;
    const mots = FILES.lexique.draft.mots;
    const savedById = new Map(FILES.lexique.saved.mots.map(w => [w.id, JSON.stringify(w)]));
    const count = (v) => mots.filter(w => placeOf(w) === v).length;

    let html = '<p class="legend">Choisissez la séquence ou l\'activité, puis ajoutez ses mots. Ils apparaissent sous la séquence et dans le lexique général de la classe (seulement quand la séquence est ouverte).</p>' +
      '<label class="lbl" for="place">Séquence ou activité</label><select id="place" class="inp">' +
      P.map(p => '<option value="' + esc(p.v) + '"' + (p.v === curPlace ? ' selected' : '') + '>' + esc(p.label) + ' (' + count(p.v) + ')</option>').join("") + '</select>';

    const here = mots.filter(w => placeOf(w) === curPlace).sort((a, b) => a.mot.localeCompare(b.mot, "fr", { sensitivity: "base" }));
    html += '<div class="panel lexpanel">';
    html += here.length ? here.map(w => {
      const changed = savedById.get(w.id) !== JSON.stringify(w);
      return '<div class="lexrow' + (changed ? ' changed' : '') + (w.id === editId ? ' editing' : '') + '"><div class="lx"><b>' + esc(w.mot) + '</b><span>' + esc(w.def) + '</span>' +
        (w.ex ? '<i>Exemple : ' + esc(w.ex) + '</i>' : '') + '</div>' +
        '<div class="lxb"><button type="button" class="mini" data-edit="' + esc(w.id) + '" aria-label="Modifier">✏️</button>' +
        '<button type="button" class="mini" data-del="' + esc(w.id) + '" aria-label="Supprimer">🗑️</button></div></div>';
    }).join("") : '<p class="muted" style="margin:4px 0">Aucun mot pour l\'instant.</p>';
    html += '</div>';

    const e = editId ? mots.find(w => w.id === editId) : null;
    html += '<div class="panel"><h2>' + (e ? '✏️ Modifier le mot' : '➕ Ajouter un mot') + '</h2>' +
      '<label class="lbl" for="lxm">Mot ou expression</label><input id="lxm" class="inp" type="text" value="' + esc(e ? e.mot : "") + '" autocomplete="off">' +
      '<label class="lbl" for="lxd">Définition</label><textarea id="lxd" class="inp" rows="3">' + esc(e ? e.def : "") + '</textarea>' +
      '<label class="lbl" for="lxe">Exemple <span class="muted">(facultatif)</span></label><input id="lxe" class="inp" type="text" value="' + esc(e && e.ex ? e.ex : "") + '" autocomplete="off">' +
      '<div class="row2">' + (e ? '<button type="button" class="btn ghost" id="lxcancel">Annuler</button>' : '') +
      '<button type="button" class="btn" id="lxok">' + (e ? 'Enregistrer' : 'Ajouter le mot') + '</button></div>' +
      '<div class="msg err" id="lxerr"></div>' +
      '<p class="muted" style="font-size:13px;margin:10px 0 0">Les mots ajoutés seront visibles par les élèves après « Publier ».</p></div>';

    app.insertAdjacentHTML("beforeend", html);

    document.getElementById("place").onchange = (ev) => {
      curPlace = ev.target.value; editId = null;
      try { sessionStorage.setItem("admin-place", curPlace); } catch (e2) {}
      render();
    };
    app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
      editId = b.dataset.edit; render();
      document.getElementById("lxm").scrollIntoView({ behavior: "smooth", block: "center" });
    });
    app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const w = mots.find(x => x.id === b.dataset.del);
      if (w && confirm("Supprimer « " + w.mot + " » ?")) {
        FILES.lexique.draft.mots = mots.filter(x => x.id !== w.id);
        if (editId === w.id) editId = null;
        render();
      }
    });
    const cancel = document.getElementById("lxcancel");
    if (cancel) cancel.onclick = () => { editId = null; render(); };
    document.getElementById("lxok").onclick = () => {
      const mot = document.getElementById("lxm").value.trim();
      const def = document.getElementById("lxd").value.trim();
      const ex = document.getElementById("lxe").value.trim();
      const err = document.getElementById("lxerr");
      if (!mot || !def) { err.textContent = "Il faut au moins le mot et sa définition."; return; }
      const p = P.find(x => x.v === curPlace);
      if (!p) return;
      const [kind, ref] = [curPlace.slice(0, 3), curPlace.slice(4)];
      const dup = mots.find(w => w.id !== editId && placeOf(w) === curPlace && w.mot.toLowerCase() === mot.toLowerCase());
      if (dup) { err.textContent = "Ce mot existe déjà pour cette séquence."; return; }
      const w = { id: editId || ("m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5)), cls: p.cls };
      w[kind] = ref; w.mot = mot; w.def = def; if (ex) w.ex = ex;
      if (editId) FILES.lexique.draft.mots = mots.map(x => x.id === editId ? w : x);
      else FILES.lexique.draft.mots = mots.concat([w]);
      editId = null;
      render();
      document.getElementById("lxm").focus();
    };
  }

  /* ---------- Annuler / Publier ---------- */
  document.getElementById("cancel").onclick = () => {
    for (const k in FILES) FILES[k].draft = clone(FILES[k].saved);
    editId = null; statusEl.textContent = ""; render();
  };

  function serialize(key) {
    const d = FILES[key].draft;
    if (key === "etat") {
      const out = { sequences: {}, ressources: {} };
      Object.keys(d.sequences).sort().forEach(k => out.sequences[k] = d.sequences[k]);
      Object.keys(d.ressources).sort().forEach(k => out.ressources[k] = d.ressources[k]);
      return out;
    }
    const keys = ["id", "cls", "seq", "res", "mot", "def", "ex"];
    return { mots: d.mots.slice().sort((a, b) => (a.cls + a.mot).localeCompare(b.cls + b.mot, "fr", { sensitivity: "base" }))
      .map(w => { const o = {}; keys.forEach(k => { if (w[k] !== undefined && w[k] !== "") o[k] = w[k]; }); return o; }) };
  }

  document.getElementById("publish").onclick = async () => {
    const pb = document.getElementById("publish");
    pb.disabled = true; statusEl.className = "status"; statusEl.style.color = ""; statusEl.textContent = "Enregistrement…";
    const todo = [];
    if (etatChanges()) todo.push("etat");
    if (lexChanges()) todo.push("lexique");
    const live = [];
    try {
      for (const key of todo) {
        const F = FILES[key], out = serialize(key);
        const text = key === "etat" ? JSON.stringify(out, null, 2) + "\n" : '{\n  "mots": [\n' + out.mots.map(w => "    " + JSON.stringify(w)).join(",\n") + '\n  ]\n}\n';
        const body = { message: F.msg, content: b64encode(text), branch: BRANCH };
        if (F.sha) body.sha = F.sha;
        const res = await gh(F.path, "PUT", body);
        F.sha = res.content.sha; F.saved = clone(out); F.draft = clone(out);
        live.push([F.path, out]);
      }
      statusEl.textContent = "⏳ Enregistré. Mise en ligne en cours (environ 1 min)…";
      render();
      waitLive(live);
    } catch (e) {
      statusEl.style.color = "var(--err)";
      statusEl.textContent = e.status === 409 || e.status === 422 ? "Un fichier a changé ailleurs : rechargez la page." :
                             e.status === 401 || e.status === 403 ? "Clé refusée : reconnectez-vous." : "Échec : " + e.message;
      pb.disabled = false;
      render();
    }
  };

  async function waitLive(files) {
    const pending = files.map(([path, out]) => ({ path, want: JSON.stringify(out) }));
    for (let i = 0; i < 60 && pending.length; i++) {
      await new Promise(r => setTimeout(r, 5000));
      for (let j = pending.length - 1; j >= 0; j--) {
        try {
          const r = await fetch(pending[j].path + "?t=" + Date.now(), { cache: "no-store" });
          if (r.ok && JSON.stringify(await r.json()) === pending[j].want) pending.splice(j, 1);
        } catch (e) {}
      }
    }
    if (!pending.length) {
      statusEl.style.color = "var(--ok)"; statusEl.textContent = "✅ En ligne : les élèves voient les changements.";
      setTimeout(() => { statusEl.textContent = ""; statusEl.style.color = ""; render(); }, 6000);
    } else {
      statusEl.textContent = "Enregistré, mais la mise en ligne prend plus de temps que prévu. Vérifiez dans quelques minutes.";
    }
  }

  load();
</script>
</body>
</html>
