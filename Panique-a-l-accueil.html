<style>
/* Idée : un hall d'hôtel clair et architecturé en fond, des cartes de verre dépoli par-dessus, un seul accent émeraude et un filet de laiton. */
:root{
  --bg:#e8eeec;
  --surface:rgba(255,255,255,.88);
  --ink:#12201c;
  --muted:#58685f;
  --accent:#0e7a62;
  --accent-dark:#0a5c4a;
  --gold:#b58a2e;
  --ok:#1f8a58;
  --ko:#c4452f;
  --line:#d3ddda;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
a{color:var(--accent-dark)}
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(236,242,240,.10) 0%,rgba(236,242,240,.5) 55%,rgba(236,242,240,.85) 100%)}
.wrap{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:18px 16px 56px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 12px;flex-wrap:wrap}
.top>div:first-child{display:contents}
.top .brand{flex:1 1 100%}
.brand{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:22px;height:2px;background:var(--gold);display:block}
.chrono{display:inline-flex;align-items:center;gap:8px;margin:0;padding:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;letter-spacing:.04em}
.chrono::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.keytag{display:flex;align-items:center;gap:5px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(10px)}
.slot{width:13px;height:13px;border-radius:50%;border:1.5px solid #aebdb8;background:transparent}
.slot.on{background:var(--accent);border-color:var(--accent)}
.card{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:26px 22px;box-shadow:0 24px 60px rgba(18,32,28,.14)}
.eyebrow{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark)}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.08;margin:0 0 14px;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:44px}
h2{font-size:28px}
p{margin:0 0 12px}
.phrase{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.28;margin:14px 0 22px;padding:0 0 0 16px;border-left:3px solid var(--gold);text-wrap:balance}
.btn{font:700 16px var(--body);min-height:50px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:#fff;padding:0 24px;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,.opt:focus-visible,.seg:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.link{background:none;border:0;padding:14px 0 0;font:600 15px var(--body);color:var(--accent-dark);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.hint{margin:14px 0 0;padding:12px 14px;background:#fff;border:1px dashed var(--gold);border-radius:12px;font-size:15px}
.fb{border-left:4px solid;padding:12px 14px;margin:14px 0;background:#fff;border-radius:0 12px 12px 0;font-size:16px}
.fb.ok{border-color:var(--ok)}
.fb.ko{border-color:var(--ko)}
.field{display:flex;flex-direction:column;gap:6px;margin:18px 0}
.field label{font-weight:600;font-size:15px}
input[type=text],textarea{font:400 18px var(--body);min-height:50px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
input[type=text]:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:140px;font-size:15px}
.small{font-size:14px;color:var(--muted)}
.line{min-height:66px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1.5px dashed #aebdb8;border-radius:14px;background:#fff;margin:12px 0}
.placeholder{font-size:15px;color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.chip{font:600 16px var(--body);min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-align:left;transition:border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip.placed{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:disabled{opacity:.5;cursor:default}
.ctx{font-size:14px;margin:0 0 4px;color:var(--muted)}
.client{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.3;margin:14px 0 18px;padding:0 0 0 16px;border-left:3px solid var(--gold)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:500 16px var(--body);text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;line-height:1.45;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.good{border-color:var(--ok);background:#e6f4ec}
.opt.bad{border-color:var(--ko);background:#fbe9e5}
.opt:disabled{cursor:default}
.gauge-label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-top:6px;color:var(--muted)}
.gauge{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--ko),var(--gold),var(--ok));background-size:600px 100%;transition:width .4s}
.digit{width:88px;height:108px;display:grid;place-items:center;margin:8px 0 14px;background:var(--accent);color:#fff;border-radius:18px;font-family:var(--display);font-size:64px;font-weight:700}
.pts{font-weight:700;color:var(--accent-dark)}
.code-in{font:700 30px var(--display);letter-spacing:.3em;text-align:center;max-width:320px}
.err{min-height:24px;color:var(--ko);font-weight:600;margin:0 0 8px}
.bulletin{border:1.5px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;background:#fff}
.bulletin dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.bulletin dt{font-weight:600;color:var(--muted)}
.bulletin dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}
.copytext{font-size:14px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;user-select:all;word-break:break-word}
.rules{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 12px}
.rules ul{margin:6px 0 0;padding-left:18px}
.tbl{overflow-x:auto;margin:0 0 16px;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--ink);color:#fff;font-weight:600}
tr:last-child td{border-bottom:0}
.qn{font-weight:700;margin:6px 0 10px}
.wrow{margin:0 0 16px}
.wdef{margin:0 0 6px;font-size:15px}
.wrow input{max-width:280px;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.wrow.ok input{border-color:var(--ok);background:#e6f4ec}
.wmeta{font-size:13px;color:var(--muted);margin-left:8px}
.first{font-family:var(--display);color:var(--accent-dark);font-weight:700}
.mail{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;display:flex;flex-direction:column;gap:4px}
.seg{font:400 15.5px var(--body);text-align:left;background:transparent;border:2px solid transparent;border-radius:10px;padding:7px 9px;color:var(--ink);cursor:pointer;line-height:1.45}
.seg:hover{border-color:var(--line)}
.seg.sel{border-color:var(--gold);background:#fbf3df}
.seg.hit{border-color:var(--ok);background:#e6f4ec}
.seg.bad{border-color:var(--ko);background:#fbe9e5;text-decoration:line-through}
.seg.miss{border:2px dashed var(--ko);background:#fff}
.seg:disabled{cursor:default}
.foot{text-align:center;font-size:13px;color:var(--muted)}
.vlist{padding-left:18px;margin:12px 0}
.vlist li{margin:0 0 6px}
.cd-wrap{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.cd-bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.cd-bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.cd-bar i.low{background:var(--ko)}
.cd{font-variant-numeric:tabular-nums;font-weight:700;min-width:48px;text-align:right}
.ans{max-width:300px;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.tile{width:46px;height:56px;display:grid;place-items:center;background:var(--ink);color:#fff;border-radius:12px;font-family:var(--display);font-size:28px;font-weight:700}
.scene7{margin:8px 0 12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
.scene7 svg{display:block;width:100%;height:auto}
.line.stack{flex-direction:column;align-items:stretch}
.line.stack .chip{width:100%}
select{font:400 16px var(--body);min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.prow{margin:0 0 14px;display:flex;flex-direction:column;gap:6px}
.prow p{margin:0;font-weight:600}
.ok-t{color:var(--ok);font-weight:700}
.ko-t{color:var(--ko);font-weight:700}
.carnet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px;backdrop-filter:blur(10px)}
.carnet summary{cursor:pointer;font-weight:700}
.carnet ol{margin:8px 0 0;padding-left:20px}
.carnet li{margin:0 0 6px}
.ord{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.orow{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px}
.orow .num{font-family:var(--display);font-weight:700;color:var(--accent-dark);min-width:18px}
.orow .tx{flex:1;font-size:16px;line-height:1.4}
.mv{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:16px;cursor:pointer}
.mv:disabled{opacity:.25;cursor:default}
.mv:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.gauge i,.btn,.chip,.opt,.cd-bar i{transition:none}}
@media (max-width:400px){h1{font-size:36px}.card{padding:22px 18px}}
</style>
</head>

<script>
/* ---------- Contenu ---------- */
const SALT="cergy-accueil-2026";
const STATE_V=9;
const CODE="372915";
const DIGITS=[3,7,2,9,1,5,1,1,1,1,1,1];
const LABELS=["Le comptoir","Le standard","Le client mécontent","Le planning","Le mot mystère","Le courrier","Les 6 erreurs","Le check-in","La fiche client","Le bon service","Les avis en ligne","Le client étranger"];

/* Étape 1 */
const PH=[
 {t:"Bonjour madame, bienvenue à l'Hôtel Le Grand Cergy.",ok:true,why:"Salutation et mot d'accueil : le client se sent attendu."},
 {t:"Pas de souci, je m'en occupe.",ok:false,why:"« Pas de souci » est familier et négatif. On préfère « Avec plaisir, je m'en occupe. »"},
 {t:"Je vous écoute.",ok:true,why:"Courte, polie, positive : le client comprend que tu es disponible."},
 {t:"Qu'est-ce qu'il y a ?",ok:false,why:"Ton brusque. Même une question courte se formule poliment : « Que puis-je faire pour vous ? »"},
 {t:"Désolé, c'est la procédure.",ok:false,why:"Argument d'autorité sans solution. On explique la règle et on propose une alternative."},
 {t:"Je ne peux pas vous donner cette information, mais je vous mets en relation avec la personne qui le peut.",ok:true,why:"Tu refuses sans fermer la porte : le client est orienté."},
 {t:"Vous vous trompez, madame.",ok:false,why:"Contredire frontalement braque le client. On reformule : « Je vérifie pour être sûre de bien comprendre. »"},
 {t:"Je vous remercie de votre patience.",ok:true,why:"Le remerciement valorise l'effort du client plutôt que de s'excuser pour tout."},
 {t:"Là, je peux rien faire pour vous.",ok:false,why:"Phrase de blocage, en plus familière. On dit ce qu'on PEUT faire."},
 {t:"Je vous rappelle dans cinq minutes avec la réponse.",ok:true,why:"Engagement précis et daté : le client sait à quoi s'attendre (à condition de le tenir)."}
];
const H1="Pose-toi deux questions : est-ce poli ? est-ce que le client sait ce que je fais pour lui ?";

/* Étape 2 */
const R2=[
 {ctx:"Le téléphone sonne à la réception. Tu décroches.",
  chips:{a:"Hôtel Le Grand Cergy, bonjour.",b:"Léa à l'appareil.",c:"Comment puis-je vous aider ?",x:"Allô ?",y:"Oui, j'écoute, c'est pour quoi ?",z:"Qui êtes-vous ?"},
  answer:['a','b','c'],
  fb:"Entreprise et salutation, prénom, offre d'aide : le client sait où il est et à qui il parle."},
 {ctx:"Un client demande une chambre double pour le 14. Tu dois vérifier ton planning.",
  chips:{d:"Puis-je vous mettre en attente un instant, le temps de vérifier ?",e:"Je vous remercie de votre patience, monsieur Martin.",f:"Bonne nouvelle : une chambre double est libre le 14.",u:"Restez en ligne, je regarde.",v:"Attendez, je regarde.",w:"Voilà, c'était long, hein."},
  answer:['d','e','f'],
  fb:"Tu demandes l'accord avant la mise en attente, tu remercies au retour, puis tu donnes la réponse."},
 {ctx:"La directrice est absente. Un client veut lui parler. Tu prends un message.",
  chips:{g:"Madame Roche est absente pour le moment.",h:"Puis-je prendre un message ?",i:"Je le lui transmets dès son retour.",j:"Elle n'est pas là, rappelez plus tard.",k:"Je sais pas où elle est.",l:"Laissez votre numéro, on verra."},
  answer:['g','h','i'],
  fb:"Tu expliques l'absence, tu proposes de prendre un message, puis tu t'engages à le transmettre."}
];
const H2="Situation 1 : l'hôtel, ton prénom, puis ta proposition d'aide. Situation 2 : tu demandes, tu remercies, tu réponds. Situation 3 : tu expliques, tu proposes, tu t'engages.";

/* Étape 3 */
const R=[
 {c:"Ça fait vingt minutes que j'attends et ma chambre n'est même pas prête !",o:[
  {t:"Je comprends votre agacement, monsieur. Je vérifie tout de suite où en est votre chambre.",p:2,why:"Tu reconnais l'émotion et tu t'engages sur une action immédiate."},
  {t:"Je suis vraiment désolée, monsieur, c'est inadmissible, ça ne devrait jamais arriver chez nous, je vais voir ce que je peux faire pour vous.",p:1,why:"Tu critiques ton propre hôtel et tu ne t'engages sur rien de précis."},
  {t:"Calmez-vous, monsieur, je n'y suis pour rien.",p:0,why:"« Calmez-vous » énerve davantage, et tu te défausses."},

function v4(){

function v6(){

function lg(k,q,a,c,ok,why){S.log.push({k,q:String(q),a:String(a),c:String(c),ok:!!ok,why:why||''});}
const STEPNAME=k=>k<12?LABELS[k]:'Enquête finale';
function recapGroups(){
  const g={};S.log.forEach(e=>{(g[e.k]=g[e.k]||[]).push(e)});return g;
}
function recapText(){
  const b=bulletinText(),g=recapGroups();
  let o=b.txt+'\n\nRÉCAPITULATIF DE '+b.name.toUpperCase()+'\nScore : '+b.t+' / '+MAXPTS+' | Temps : '+b.time+'\n';
  Object.keys(g).sort((x,y)=>x-y).forEach(k=>{
    o+='\n== '+STEPNAME(+k)+' : '+S.pts[k]+' pt(s)'+(S.hint[k]?' (indice utilisé)':'')+' ==\n';
    g[k].forEach(e=>{
      o+=(e.ok?'[OK] ':'[ERREUR] ')+e.q+'\n   Ma réponse : '+e.a+'\n';
      if(!e.ok)o+='   Attendu : '+e.c+'\n';
      if(!e.ok&&e.why)o+='   Pourquoi : '+e.why+'\n';
    });
  });
  return o;
}
function recapHtml(){
  const b=bulletinText(),g=recapGroups();
  const nOk=S.log.filter(e=>e.ok).length,nKo=S.log.length-nOk;
  let rows='',det='';
  Object.keys(g).sort((x,y)=>x-y).forEach(k=>{
    const ok=g[k].filter(e=>e.ok).length;
    rows+=`<tr><td>${esc(STEPNAME(+k))}</td><td>${S.pts[k]}</td><td>${ok} / ${g[k].length}${S.hint[k]?' (indice)':''}</td></tr>`;

function pts7(){const s=S.s7;return Math.max(0,s.found.length-Math.floor(s.misses/2)-(S.hint[6]?1:0))}
function scene7(mode){
  const s=S.s7;

    const f=s.found.includes(i);
    let mark='';
    if(f)mark=`<circle cx="${h.x}" cy="${h.y}" r="${h.r}" fill="rgba(31,138,88,.2)" stroke="#1f8a58" stroke-width="3"/>`;
    else if(mode==='res')mark=`<circle cx="${h.x}" cy="${h.y}" r="${h.r}" fill="rgba(196,69,47,.12)" stroke="#c4452f" stroke-width="3" stroke-dasharray="6 4"/>`;
    const hit=(mode==='play'&&!f)?`<circle cx="${h.x}" cy="${h.y}" r="${h.r}" fill="rgba(0,0,0,0.001)" data-act="spot7" data-v="${i}" style="cursor:pointer"/>`:'';
    return mark+hit;
  }).join('');
  const bg=mode==='play'?`<rect width="360" height="280" fill="rgba(0,0,0,0.001)" data-act="miss7"/>`:'';
  return `<svg viewBox="0 0 360 280" role="img" aria-label="Scène d'accueil avec six erreurs à repérer" xmlns="http://www.w3.org/2000/svg">${BODY7}${bg}${hs}</svg>`;
}

function act(a,v){
  save5();save9();save10();save13();
  const s1=S.s1,s2=S.s2,s3=S.s3,s4=S.s4,s5=S.s5,s6=S.s6;
  switch(a){
    case 'start':{
      const el=document.getElementById('prenom');
      const name=((el&&el.value)||'').replace(/\|/g,'').trim().slice(0,30);
      S=fresh();S.name=name;S.t0=Date.now();S.screen='s1';break;
    }
    case 'hint':S.hint[+v]=true;break;
    /* 1 */
    case 'a1':{
      if(s1.ans!==null)return;
      const ok=(v==='true')===PH[s1.order[s1.i]].ok;
      lg(0,PH[s1.order[s1.i]].t,v==='true'?'Je la juge correcte':'Je la juge à corriger',PH[s1.order[s1.i]].ok?'Phrase correcte':'Phrase à corriger',ok,PH[s1.order[s1.i]].why);
      s1.ans=ok;if(ok)s1.score++;break;
    }
    case 'n1':
      s1.i++;s1.ans=null;
      if(s1.i>=PH.length){S.pts[0]=Math.max(0,s1.score-(S.hint[0]?1:0));S.digits[0]=DIGITS[0];}
      break;
    /* 2 */
    case 'pick':if(!s2.ok&&!s2.line.includes(v))s2.line.push(v);s2.msg='';break;
    case 'unpick':if(!s2.ok){s2.line=s2.line.filter(x=>x!==v);s2.msg='';}break;
    case 'clear':s2.line=[];s2.msg='';break;
    case 'check':
      lg(1,R2[s2.r].ctx,s2.line.map(x=>R2[s2.r].chips[x]).join(' / ')||'(vide)',R2[s2.r].answer.map(x=>R2[s2.r].chips[x]).join(' / '),s2.line.join()===R2[s2.r].answer.join(),R2[s2.r].fb);
      if(s2.line.join()===R2[s2.r].answer.join()){
        s2.ok=true;s2.score+=Math.max(1,3-s2.wrong);
      }else{
        s2.wrong++;s2.msg="Ce n'est pas encore ça. Lis ta phrase à voix haute et essaie un autre ordre.";
      }
      break;
    case 'n2':
      s2.r++;s2.line=[];s2.wrong=0;s2.ok=false;s2.msg='';
      if(s2.r>=R2.length){S.pts[1]=Math.max(0,s2.score-(S.hint[1]?1:0));S.digits[1]=DIGITS[1];}
      else s2.pool=shuffle(Object.keys(R2[s2.r].chips));
      break;
    /* 3 */
    case 'a3':{
      if(s3.picked!==null)return;
      s3.picked=+v;const o=R[s3.r].o[+v];
      lg(2,R[s3.r].c,o.t,R[s3.r].o.find(x=>x.p===2).t,o.p===2,o.why);
      s3.score+=o.p;s3.gauge=clamp(s3.gauge+(o.p===2?25:o.p===1?8:-15));break;
    }
    case 'n3':
      s3.r++;s3.picked=null;
      if(s3.r>=R.length){S.pts[2]=Math.max(0,s3.score-(S.hint[2]?1:0));S.digits[2]=DIGITS[2];}
      break;
    /* 4 */
    case 'a4':{
      if(s4.status!=='idle')return;
      const q=Q4[s4.i];
      lg(3,q.text,q.options[+v],q.options[q.answer],+v===q.answer,q.why);
      if(+v===q.answer){s4.status='ok';s4.score+=s4.tries===0?2:1;}
      else{s4.tries++;s4.bad.push(+v);if(s4.tries>=2)s4.status='fail';}
      break;
    }
    case 'a4num':{
      if(s4.status!=='idle')return;
      const el=document.getElementById('n4');
      const val=parseFloat(String((el&&el.value)||'').replace(',','.').replace(/[^0-9.]/g,''));
      lg(3,Q4[s4.i].text,isNaN(val)?'(vide)':val+' €',Q4[s4.i].answer+' €',!isNaN(val)&&Math.abs(val-Q4[s4.i].answer)<0.005,Q4[s4.i].why);
      if(!isNaN(val)&&Math.abs(val-Q4[s4.i].answer)<0.005){s4.status='ok';s4.score+=s4.tries===0?2:1;}
      else{s4.tries++;if(s4.tries>=2)s4.status='fail';}
      break;
    }
    case 'n4':
      s4.i++;s4.tries=0;s4.status='idle';s4.bad=[];
      if(s4.i>=Q4.length){S.pts[3]=Math.max(0,s4.score-(S.hint[3]?1:0));S.digits[3]=DIGITS[3];}
      break;
    /* 5 */
    case 'start5':s5.phase='ask';s5.i=0;s5.t0=Date.now();s5.hintUsed=false;s5.val='';s5.msg='';break;
    case 'hint5':s5.hintUsed=true;break;
    case 'ans5':{
      if(s5.phase!=='ask')return;
      if(left5()<=0){endWord(false);break;}
      const val=norm(s5.val),w=W[s5.i];
      if(val===w.w||val===w.w+'S')endWord(true);
      else s5.msg=val===''?'Écris ta réponse avant de valider.':"Ce n'est pas ça. Tu as encore du temps.";
      break;
    }
    case 'timeout5':if(s5.phase==='ask')endWord(false);else return;break;
    case 'next5':
      s5.i++;s5.val='';s5.msg='';s5.hintUsed=false;s5.t0=Date.now();
      if(s5.i>=W.length){s5.phase='final';s5.finalHint=false;}else s5.phase='ask';
      break;
    case 'hint5f':s5.finalHint=true;break;
    case 'ans5f':
      if(s5.phase!=='final')return;
      if(left5()<=0){endFinal(false);break;}
      if(norm(s5.val)===FINAL5)endFinal(true);
      else s5.msg=norm(s5.val)===''?'Écris ta réponse avant de valider.':"Ce n'est pas le bon mot. Réarrange les lettres affichées.";
      break;
    case 'timeoutf':if(s5.phase==='final')endFinal(false);else return;break;
    case 'fin5':
      S.pts[4]=s5.wp.reduce((a,b)=>a+b,0)+s5.fp;S.digits[4]=DIGITS[4];s5.phase='done';break;
    /* 6 */
    case 'sel6':{
      if(s6.checked)return;
      const i=+v;
      s6.sel=s6.sel.includes(i)?s6.sel.filter(x=>x!==i):s6.sel.concat(i);break;
    }
    case 'check6':
      s6.checked=true;
      lg(5,'Repérer les erreurs du courrier ('+NERR6+' à trouver)',s6.sel.map(i=>M6[i].t).join(' / ')||'(rien sélectionné)',M6.filter(m=>m.err).map(m=>m.t).join(' / '),s6.sel.filter(i=>M6[i].err).length===NERR6&&s6.sel.length===NERR6,s6.sel.filter(i=>M6[i].err).length+' erreur(s) trouvée(s), '+(s6.sel.length-s6.sel.filter(i=>M6[i].err).length)+' fausse(s) alerte(s).');
      s6.hits=s6.sel.filter(i=>M6[i].err).length;
      s6.falses=s6.sel.length-s6.hits;
      s6.score=Math.max(0,s6.hits-s6.falses);
      break;
    case 'n6':
      s6.done=true;S.pts[5]=Math.max(0,s6.score-(S.hint[5]?1:0));S.digits[5]=DIGITS[5];break;
    /* navigation */
    case 'goto':
      if(v==='fin')S.tEnd=Date.now();
      if(v==='s7'){S.s7.phase='play';S.s7.t0=Date.now();}
      S.screen=v;break;
    /* 7 */
    case 'spot7':{
      const s7=S.s7;if(s7.phase!=='play')return;
      const i=+v;if(!s7.found.includes(i))s7.found.push(i);
      s7.msg='';if(s7.found.length>=HS7.length)s7.phase='res';
      break;
    }
    case 'miss7':{const s7=S.s7;if(s7.phase!=='play')return;s7.misses++;s7.msg="Pas d'erreur à cet endroit.";break;}
    case 'end7':case 'timeout7':if(S.s7.phase==='play')S.s7.phase='res';else return;break;
    case 'fin7':lg(6,'Repérer les erreurs de la réception ('+HS7.length+' à trouver)',S.s7.found.map(i=>HS7[i].n).join(', ')||'(aucune)',HS7.map(h=>h.n).join(', '),S.s7.found.length===HS7.length,S.s7.misses+' clic(s) à côté.');S.pts[6]=pts7();S.digits[6]=1;S.s7.phase='done';break;
    /* 8 */
    case 'up8':{const o=S.s8.order,n=+v;if(n>0){const t=o[n-1];o[n-1]=o[n];o[n]=t;}S.s8.msg='';break;}
    case 'down8':{const o=S.s8.order,n=+v;if(n<o.length-1){const t=o[n+1];o[n+1]=o[n];o[n]=t;}S.s8.msg='';break;}
    case 'check8':{
      const s8=S.s8;
      const right=s8.order.filter((x,n)=>x===n).length;
      lg(7,'Remettre les étapes du check-in dans l\'ordre',s8.order.map(x=>STEPS8[x]).join(' / '),STEPS8.join(' / '),right===STEPS8.length,right+' étape(s) à la bonne place sur '+STEPS8.length+'.');
      if(right===STEPS8.length){s8.solved=true;s8.phase='res';}
      else{
        s8.wrong++;
        if(s8.wrong>=4){s8.solved=false;s8.phase='res';}
        else s8.msg=`${right} étape${right>1?'s sont':' est'} à la bonne place sur ${STEPS8.length}.`;
      }
      break;
    }
    case 'fin8':S.pts[7]=pts8();S.digits[7]=1;S.s8.phase='done';break;
    /* 9 */
    case 'sp9':{
      const s9=S.s9;if(s9.phase!=='spell')return;
      lg(8,'Noter le nom épelé au téléphone',s9.val||'(vide)',NAME9,norm(s9.val)===NAME9,'');
      if(norm(s9.val)===NAME9){s9.sp=s9.tries===0?2:1;s9.okSpell=true;s9.phase='spellres';}
      else{
        s9.tries++;
        if(s9.tries>=2){s9.sp=0;s9.okSpell=false;s9.phase='spellres';}
        else s9.msg="Ce n'est pas le bon nom. Il te reste un essai.";
      }
      if(s9.phase!=='spell'){s9.val='';s9.msg='';}
      break;
    }
    case 'to9':S.s9.phase='fiche';S.s9.msg='';break;
    case 'check9':{
      const s9=S.s9;if(s9.phase!=='fiche')return;
      F9.forEach((f,i)=>{const el=document.getElementById('f9_'+i);s9.vals[i]=el?el.value:'';});
      s9.ok=F9.map((f,i)=>f.type==='tel'?s9.vals[i].replace(/\D/g,'')===f.ans:s9.vals[i]===f.ans);
      F9.forEach((f,i)=>lg(8,'Fiche client : '+f.lab,s9.vals[i]||'(vide)',f.ans,s9.ok[i],''));
      s9.fp=s9.ok.filter(Boolean).length;s9.phase='res';break;
    }
    case 'fin9':S.pts[8]=pts9();S.digits[8]=1;S.s9.phase='done';break;
    /* 10 */
    case 'check10':{
      const s10=S.s10;if(s10.phase!=='play')return;
      PROF10.forEach((p,i)=>{const el=document.getElementById('s10_'+i);s10.vals[i]=el?el.value:'';});
      s10.ok=PROF10.map((p,i)=>s10.vals[i]===p.a);
      PROF10.forEach((p,i)=>lg(9,p.c,s10.vals[i]||'(vide)',p.a,s10.ok[i],''));
      s10.phase='res';break;
    }
    case 'fin10':S.pts[9]=pts10();S.digits[9]=1;S.s10.phase='done';break;
    /* enquête */
    case 'check13':{
      const s=S.s13;if(s.phase!=='play')return;
      ENQ.forEach((q,i)=>{const el=document.getElementById('e13_'+i);if(el&&!s.locked[i])s.vals[i]=el.value;});
      ENQ.forEach((q,i)=>{if(!s.locked[i])lg(12,q.lab+' (essai '+(s.tries+1)+')',s.vals[i]||'(vide)',q.ans,s.vals[i]===q.ans,'');});
      ENQ.forEach((q,i)=>{if(!s.locked[i]&&s.vals[i]===q.ans){s.locked[i]=true;s.got[i]=s.tries===0?3:1;}});
      const n=s.locked.filter(Boolean).length;
      if(n===ENQ.length)s.phase='res';
      else{s.tries++;if(s.tries>=2)s.phase='res';else s.msg=`${n} réponse${n>1?'s':''} juste${n>1?'s':''} sur ${ENQ.length}. Relis tes indices pour les autres.`;}
      break;
    }
    case 'fin13':S.pts[12]=ptsEnq();S.digits[12]=1;S.s13.phase='done';S.tEnd=Date.now();S.screen='fin';break;
    /* 11 et 12 */
    case 'ar':{
      const parts=v.split(':'),s=S[parts[0]];if(s.picked!==null)return;
      {const rd=RCFG[parts[0]].rounds[s.r],o=rd.o[+parts[1]];lg(RCFG[parts[0]].k,rd.c,o.t,rd.o.find(x=>x.p===2).t,o.p===2,o.why);}
      s.picked=+parts[1];s.score+=RCFG[parts[0]].rounds[s.r].o[+parts[1]].p;break;
    }
    case 'nr':{
      const s=S[v],cfg=RCFG[v];s.r++;s.picked=null;
      if(s.r>=cfg.rounds.length){S.pts[cfg.k]=Math.max(0,s.score-(S.hint[cfg.k]?1:0));S.digits[cfg.k]=1;}
      break;
    }
    case 'replay':S=fresh();break;
    case 'open':{
      const el=document.getElementById('code'),err=document.getElementById('err');
      if(el&&el.value.trim()===CODE){S.tEnd=Date.now();S.screen='fin';break;}
      if(err)err.textContent="Ce n'est pas le bon code. Vérifie les chiffres de ta clé, dans l'ordre des étapes.";
      return;
    }
    case 'save':{
      const msg=document.getElementById('savemsg'),name=((S.name||'eleve').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]/g,'')||'eleve');
      const html=recapHtml();
      (async()=>{
        try{
          const d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
          if(!d){
            try{
              const url=URL.createObjectURL(new Blob([html],{type:'text/html'})),a=document.createElement('a');
              a.href=url;a.download='Panique-accueil-'+name+'.html';document.body.appendChild(a);a.click();a.remove();
              setTimeout(()=>URL.revokeObjectURL(url),4000);
              msg.textContent="Fichier enregistré dans tes téléchargements. Dépose-le sur Pronote.";
            }catch(e2){msg.textContent="Enregistrement impossible. Réessaie, ou fais une capture d'écran de ton bulletin.";}
            return;
          }
          await d.save({filename:'Panique-accueil-'+name+'.html',data:new Blob([html],{type:'text/html'})});
          msg.textContent="Fichier enregistré. Dépose-le sur Pronote.";
        }catch(e){msg.textContent="Enregistrement non effectué. Clique de nouveau sur le bouton.";}
      })();
      return;
    }
    case 'copyrecap':{
      const btn=document.getElementById('recbtn'),txt=recapText();
      try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Récapitulatif copié'},()=>{btn.textContent='Copie impossible'});}catch(e){btn.textContent='Copie impossible';}
      return;
    }
    case 'copy':{
      const btn=document.getElementById('copybtn'),txt=document.getElementById('copytext').textContent;
      try{
        navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Texte copié'},()=>{btn.textContent='Sélectionne le texte ci-dessus'});
      }catch(e){btn.textContent='Sélectionne le texte ci-dessus';}
      return;
    }
    case 'verify':{
      const lines=(document.getElementById('profin').value||'').split('\n').map(l=>l.trim()).filter(Boolean);
      const out=lines.map(l=>{
        const p=l.split('|').map(x=>x.trim());
        if(p.length<5)return `<li><strong>Illisible</strong> : ${esc(l)}</li>`;
        const name=p[1],score=parseInt(p[2],10),time=p[3],code=p[4].replace(/^code\s*/i,'').toUpperCase();
        if(isNaN(score))return `<li><strong>Illisible</strong> : ${esc(l)}</li>`;
        const ok=sig(name,score,time)===code;
        return ok?`<li><strong>Valide</strong> : ${esc(name)}, ${esc(p[2])} en ${esc(time)}.</li>`:`<li><strong>Invalide</strong> : ${esc(name)} (texte modifié ou code inventé).</li>`;
      });
      document.getElementById('vres').innerHTML=out.length?out.join(''):'<li>Aucun texte collé.</li>';
      return;
    }
    default:return;
  }
  render();
}

$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b&&!b.disabled)act(b.dataset.act,b.dataset.v);
});
$app.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='prenom')act('start');
  if(e.target.id==='code')act('open');
  if(e.target.id==='n4')act('a4num');
});
window.addEventListener('hashchange',render);
setInterval(()=>{
  const c=document.getElementById('chrono');
  if(c&&S.t0&&!S.tEnd)c.textContent=fmt(elapsed());
  if(location.hash==='#prof')return;
  const t=timerInfo();
  if(!t)return;
  const l=left5(),lim=t.lim;
  const cd=document.getElementById('cd'),bar=document.getElementById('cdbar');
  if(cd)cd.textContent=l+' s';
  if(bar){bar.style.width=(l/lim*100)+'%';bar.className=l<=10?'low':'';}
  if(l<=0)act(t.act);
},1000);

function boot(d){
  if(d&&d.v===STATE_V&&Array.isArray(d.log)&&d.screen&&d.s1&&d.s6&&d.s5&&d.s5.phase&&d.s12&&d.s13&&Array.isArray(d.digits)&&d.digits.length===13)S=d;
  render();
}
if(window.claude&&window.claude.hot){
  window.claude.hot.snapshot(()=>S);
  window.claude.hot.ready?window.claude.hot.ready(boot):boot(window.claude.hot.data);
}else{
  boot();
}
</script>
</body>
</html>
