<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle de jeux</title>
<meta name="description" content="Les jeux pédagogiques de la classe — entre ton code pour débloquer une mission.">
<meta name="theme-color" content="#1b1640">
<style>
  :root {
    --bg: #f4f1ea;
    --bg2: #e9e3d6;
    --ink: #1d1a2e;
    --muted: #625d75;
    --card: #ffffff;
    --line: #d9d2c3;
    --accent: #ff5a36;
    --ok: #1f9d6b;
    --err: #d23c3c;
    --shadow: 0 2px 0 rgba(29,26,46,.9);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15122b; --bg2: #1d1940; --ink: #f3efff; --muted: #a9a3c4;
      --card: #231f47; --line: #3a3466; --shadow: 0 2px 0 rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(circle at 15% 0%, var(--bg2), transparent 55%), var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }

  header { text-align: center; margin-bottom: 28px; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--accent); border: 2px solid var(--accent);
    border-radius: 999px; padding: 4px 12px; margin-bottom: 14px;
  }
  h1 { font-size: clamp(32px, 8vw, 48px); line-height: 1.05; margin: 0 0 10px; letter-spacing: -.02em; }
  header p { color: var(--muted); margin: 0; font-size: 16px; }

  form {
    display: flex; gap: 8px; background: var(--card); border: 2px solid var(--ink);
    border-radius: 16px; padding: 8px; box-shadow: var(--shadow); margin-bottom: 10px;
  }
  form.shake { animation: shake .4s; border-color: var(--err); }
  @keyframes shake { 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font: 700 20px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .15em;
    text-transform: uppercase; padding: 10px 8px; outline: none;
  }
  input::placeholder { color: var(--muted); letter-spacing: .05em; font-weight: 500; }
  button {
    border: 0; border-radius: 10px; background: var(--accent); color: #fff;
    font: 700 16px system-ui, sans-serif; padding: 0 18px; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  #msg { min-height: 22px; text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 18px; }
  #msg.err { color: var(--err); } #msg.ok { color: var(--ok); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card {
    position: relative; display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 2px solid var(--ink); border-radius: 18px;
    padding: 18px; box-shadow: var(--shadow); overflow: hidden;
    transition: transform .15s;
  }
  .card .emoji { font-size: 40px; line-height: 1; margin-bottom: 10px; display: block; }
  .card h2 { font-size: 20px; margin: 0 0 4px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .card .stripe { position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--c); }
  .card .state {
    position: absolute; top: 14px; right: 14px; font-size: 12px; font-weight: 700;
    border-radius: 999px; padding: 4px 10px; background: var(--bg2); color: var(--muted);
  }
  .card.locked { cursor: pointer; }
  .card.locked .emoji, .card.locked h2, .card.locked p { filter: grayscale(1); opacity: .45; }
  .card.open { cursor: pointer; }
  .card.open:hover { transform: translateY(-2px); }
  .card.open .state { background: var(--c); color: #fff; }
  .card.pop { animation: pop .5s; }
  @keyframes pop { 40% { transform: scale(1.04); } }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
  footer button { background: none; color: var(--muted); text-decoration: underline; padding: 0; font-weight: 500; font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <span class="badge">Salle de jeux</span>
    <h1>Choisis ta mission</h1>
    <p>Entre le code donné par ton prof pour débloquer un jeu.</p>
  </header>

  <form id="f" autocomplete="off">
    <input id="code" placeholder="Ton code" aria-label="Code d'accès" autocapitalize="characters" spellcheck="false" enterkeyhint="go">
    <button type="submit">Valider</button>
  </form>
  <div id="msg" role="status"></div>

  <div class="grid" id="grid"></div>

  <footer>
    <button type="button" id="reset">Verrouiller à nouveau les jeux sur cet appareil</button>
  </footer>
</main>

<script>
  // Les codes ne sont pas écrits en clair : seule leur empreinte SHA-256 est stockée.
  const GAMES = [
    { id: "accueil", emoji: "🛎️", title: "Panique à l'accueil", desc: "Gère la foule et garde ton calme.",
      url: "Panique-a-l-accueil.html", color: "#ff5a36",
      hash: "a6062afd65f94b809a757002817f3f33216fd4ee49e4de5fe2873100104e0888" },
    { id: "pion", emoji: "📍", title: "Le Pion Rouge", desc: "Explore la zone de chalandise.",
      url: "Le-Pion-Rouge.html", color: "#d6336c",
      hash: "8581090ff3d8eb2cad0399017b09b4de6a2bbbb80f8ba7b19f8d6ce25e3a9e24" },
    { id: "springfield", emoji: "⚡", title: "Panne à Springfield", desc: "Trouve l'origine de la panne.",
      url: "Panne-a-Springfield.html", color: "#e8a400",
      hash: "6b369a143d712d79f13290610108af45188c6f7044fa45fffccff130facfddbf" },
    { id: "cap", emoji: "🧭", title: "Mon cap pour la Première", desc: "Trace ta route pour l'an prochain.",
      url: "Mon-cap-pour-la-Premiere.html", color: "#3b6fe0",
      hash: "7b0b3ae66181338c7ea3b80948e36eda48dc11432b35d2be413e4b578a8737fd" },
  ];

  const KEY = "salle-de-jeux-debloques";
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
  let unlocked = load();

  const grid = document.getElementById("grid");
  const form = document.getElementById("f");
  const input = document.getElementById("code");
  const msg = document.getElementById("msg");

  function render(popId) {
    grid.innerHTML = "";
    for (const g of GAMES) {
      const open = unlocked.includes(g.id);
      const el = document.createElement(open ? "a" : "div");
      el.className = "card " + (open ? "open" : "locked") + (g.id === popId ? " pop" : "");
      el.style.setProperty("--c", g.color);
      if (open) el.href = g.url;
      el.innerHTML =
        '<span class="stripe"></span>' +
        '<span class="state">' + (open ? "Jouer ▸" : "🔒 Verrouillé") + '</span>' +
        '<span class="emoji">' + g.emoji + '</span>' +
        '<h2></h2><p></p>';
      el.querySelector("h2").textContent = g.title;
      el.querySelector("p").textContent = g.desc;
      if (!open) el.addEventListener("click", () => { input.focus(); say("Ce jeu est verrouillé : entre son code.", "err"); });
      grid.appendChild(el);
    }
  }

  function say(text, cls) { msg.textContent = text; msg.className = cls || ""; }

  function normalize(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
  }

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = normalize(input.value);
    if (!code) return;
    let h;
    try { h = await sha256("jeux:" + code); }
    catch (err) { say("Ton navigateur ne peut pas vérifier le code. Essaie un autre navigateur.", "err"); return; }
    const g = GAMES.find(x => x.hash === h);
    if (!g) {
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
      say("Code inconnu… vérifie l'orthographe.", "err");
      return;
    }
    if (!unlocked.includes(g.id)) { unlocked.push(g.id); save(unlocked); }
    input.value = "";
    say("🎉 « " + g.title + " » débloqué ! Ouverture…", "ok");
    render(g.id);
    setTimeout(() => { location.href = g.url; }, 900);
  });

  form.addEventListener("animationend", () => form.classList.remove("shake"));

  document.getElementById("reset").addEventListener("click", () => {
    unlocked = []; save(unlocked); render(); say("Tous les jeux sont de nouveau verrouillés.", "");
  });

  render();
</script>
</body>
</html>
