<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle de jeux</title>
<meta name="description" content="Les jeux pédagogiques de PMCV2 et SMRC2 — choisis ta classe, ton cours, et entre ton code.">
<meta name="theme-color" content="#1b1640">
<style>
  :root {
    --bg: #f4f1ea;
    --bg2: #e9e3d6;
    --ink: #1d1a2e;
    --muted: #625d75;
    --card: #ffffff;
    --err: #d23c3c;
    --ok: #1f9d6b;
    --accent: #ff5a36;
    --shadow: 0 2px 0 rgba(29,26,46,.9);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15122b; --bg2: #1d1940; --ink: #f3efff; --muted: #a9a3c4;
      --card: #231f47; --shadow: 0 2px 0 rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(circle at 15% 0%, var(--bg2), transparent 55%), var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }

  nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 34px; margin-bottom: 14px; font-size: 14px; }
  nav a { color: var(--muted); text-decoration: none; font-weight: 600; }
  nav a:hover { color: var(--ink); }
  nav .sep { color: var(--muted); opacity: .5; }
  nav .here { font-weight: 700; }
  .back {
    display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
    border: 2px solid var(--ink); border-radius: 10px; background: var(--card); color: var(--ink);
    text-decoration: none; font-weight: 700; margin-right: 6px; box-shadow: var(--shadow);
  }

  header { text-align: center; margin-bottom: 22px; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--c, var(--accent)); border: 2px solid var(--c, var(--accent));
    border-radius: 999px; padding: 4px 12px; margin-bottom: 12px;
  }
  h1 { font-size: clamp(30px, 8vw, 46px); line-height: 1.05; margin: 0 0 8px; letter-spacing: -.02em; }
  header p { color: var(--muted); margin: 0; font-size: 16px; }

  form {
    display: flex; gap: 8px; background: var(--card); border: 2px solid var(--ink);
    border-radius: 16px; padding: 8px; box-shadow: var(--shadow); margin-bottom: 8px;
  }
  form.shake { animation: shake .4s; border-color: var(--err); }
  @keyframes shake { 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font: 700 20px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .15em;
    text-transform: uppercase; padding: 10px 8px; outline: none;
  }
  input::placeholder { color: var(--muted); letter-spacing: .05em; font-weight: 500; text-transform: none; }
  button {
    border: 0; border-radius: 10px; background: var(--c, var(--accent)); color: #fff;
    font: 700 16px system-ui, sans-serif; padding: 0 18px; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  #msg { min-height: 22px; text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  #msg.err { color: var(--err); } #msg.ok { color: var(--ok); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card {
    position: relative; display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 2px solid var(--ink); border-radius: 18px;
    padding: 18px; box-shadow: var(--shadow); overflow: hidden; transition: transform .15s;
  }
  a.card:hover { transform: translateY(-2px); }
  .card .stripe { position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--c); }
  .card .emoji { font-size: 40px; line-height: 1; margin-bottom: 10px; display: block; }
  .card h2 { font-size: 20px; margin: 0 0 4px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .card .state {
    position: absolute; top: 14px; right: 14px; font-size: 12px; font-weight: 700;
    border-radius: 999px; padding: 4px 10px; background: var(--bg2); color: var(--muted);
  }
  .card.go .state { background: var(--c); color: #fff; }

  .card.big { padding: 26px 20px; }
  .card.big h2 { font-size: 30px; letter-spacing: -.01em; }

  .card.locked { cursor: pointer; }
  .card.locked .emoji, .card.locked h2, .card.locked p { filter: grayscale(1); opacity: .45; }
  .card.soon { border-style: dashed; box-shadow: none; }
  .card.soon .emoji, .card.soon h2, .card.soon p { opacity: .55; }
  .card.pop { animation: pop .5s; }
  @keyframes pop { 40% { transform: scale(1.04); } }

  .empty {
    text-align: center; color: var(--muted); border: 2px dashed var(--muted); border-radius: 18px;
    padding: 30px 18px; opacity: .8;
  }
  .empty .emoji { font-size: 40px; display: block; margin-bottom: 8px; }

  .section { margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  .section:first-child { margin-top: 0; }
  .section::after { content: ""; flex: 1; height: 2px; background: var(--ink); opacity: .12; }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
  footer button { background: none; color: var(--muted); text-decoration: underline; padding: 0; font-weight: 500; font-size: 13px; }
</style>
</head>
<body>
<main>
  <nav id="nav"></nav>
  <header id="head"></header>

  <form id="f" autocomplete="off">
    <input id="code" placeholder="Code donné par ton prof" aria-label="Code d'accès" autocapitalize="characters" spellcheck="false" enterkeyhint="go">
    <button type="submit">Valider</button>
  </form>
  <div id="msg" role="status"></div>

  <div id="view"></div>

  <footer>
    <button type="button" id="reset">Verrouiller à nouveau les jeux sur cet appareil</button>
  </footer>
</main>

<script>
  /* ================= CONFIGURATION =================
     CLASSES    : les classes et leurs cours
     SEQUENCES  : les séquences d'un cours (facultatif)
     RESSOURCES : jeux, quiz, fiches PDF, cours en ligne.
       type   : "jeu" | "quiz" | "fiche" | "cours"
       cls / course / seq : où la ressource est rangée (seq facultatif)
       hash   : uniquement pour les jeux — empreinte SHA-256 de "jeux:CODE" */

  const CLASSES = [
    { id: "pmcv2", name: "PMCV2", emoji: "🛍️", color: "#ff5a36",
      full: "Première Métiers du Commerce et de la Vente",
      courses: [
        { id: "pro",   emoji: "🏪", name: "Enseignement pro", sub: "Tronc commun" },
        { id: "optA",  emoji: "🎯", name: "Option A", sub: "Animation et gestion de l'espace commercial" },
      ] },
    { id: "smrc2", name: "SMRC2", emoji: "🤝", color: "#3b6fe0",
      full: "Seconde Métiers de la Relation Client",
      courses: [
        { id: "accueil",  emoji: "🛎️", name: "Enseignement pro", sub: "Accueil" },
        { id: "ecodroit", emoji: "⚖️", name: "Éco-droit", sub: "Économie et droit" },
        { id: "soutien",  emoji: "🧭", name: "Soutien au parcours", sub: "Construire son orientation" },
      ] },
  ];

  const SEQUENCES = [
    { cls: "pmcv2", course: "pro", id: "chalandise", emoji: "🗺️",
      name: "La zone de chalandise",
      notions: "Isochrones et isométriques · zones primaire, secondaire, tertiaire · CA potentiel et rentabilité" },
    { cls: "pmcv2", course: "pro", id: "veille", emoji: "🔎",
      name: "La veille commerciale",
      notions: "Sources internes et externes · les 5 étapes de la veille · critères d'une information utile" },
  ];

  const RESSOURCES = [
    // ---- PMCV2 · Enseignement pro · Zone de chalandise
    { type: "jeu", id: "pion", cls: "pmcv2", course: "pro", seq: "chalandise", emoji: "📍",
      title: "Le Pion Rouge", desc: "Explore la zone de chalandise.",
      url: "Le-Pion-Rouge.html", color: "#d6336c",
      hash: "8581090ff3d8eb2cad0399017b09b4de6a2bbbb80f8ba7b19f8d6ce25e3a9e24" },
    { type: "quiz", id: "zone-chalandise", cls: "pmcv2", course: "pro", seq: "chalandise", emoji: "🧠",
      title: "Quiz : la zone de chalandise", desc: "10 questions chronométrées · calculatrice conseillée",
      url: "quiz.html?q=zone-chalandise", color: "#ff5a36" },
    { type: "fiche", id: "fiche-chalandise", cls: "pmcv2", course: "pro", seq: "chalandise", emoji: "📄",
      title: "Fiche : la zone de chalandise", desc: "L'essentiel à retenir + je sais utiliser (recto-verso)",
      url: "fiches/zone-de-chalandise.pdf", color: "#e8a400" },

    // ---- PMCV2 · Enseignement pro · Veille commerciale
    { type: "fiche", id: "fiche-veille", cls: "pmcv2", course: "pro", seq: "veille", emoji: "📄",
      title: "Fiche : la veille commerciale", desc: "Sources, 5 étapes, critères d'une info utile (recto-verso)",
      url: "fiches/veille-commerciale.pdf", color: "#1f9d6b" },

    // ---- SMRC2
    { type: "jeu", id: "accueil", cls: "smrc2", course: "accueil", emoji: "🛎️",
      title: "Panique à l'accueil", desc: "Gère la foule et garde ton calme.",
      url: "Panique-a-l-accueil.html", color: "#ff5a36",
      hash: "a6062afd65f94b809a757002817f3f33216fd4ee49e4de5fe2873100104e0888" },
    { type: "jeu", id: "springfield", cls: "smrc2", course: "ecodroit", emoji: "⚡",
      title: "Panne à Springfield", desc: "Trouve l'origine de la panne.",
      url: "Panne-a-Springfield.html", color: "#e8a400",
      hash: "6b369a143d712d79f13290610108af45188c6f7044fa45fffccff130facfddbf" },
    { type: "jeu", id: "cap", cls: "smrc2", course: "soutien", emoji: "🧭",
      title: "Mon cap pour la Première", desc: "Trace ta route pour l'an prochain.",
      url: "Mon-cap-pour-la-Premiere.html", color: "#3b6fe0",
      hash: "7b0b3ae66181338c7ea3b80948e36eda48dc11432b35d2be413e4b578a8737fd" },
  ];

  const TYPES = [
    { id: "cours", label: "📖 Cours en ligne" },
    { id: "fiche", label: "📄 Fiches de révision" },
    { id: "quiz",  label: "🧠 Quiz" },
    { id: "jeu",   label: "🎮 Jeux" },
  ];

  /* ================= LOGIQUE ================= */

  const KEY = "salle-de-jeux-debloques";
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
  function quizBest(id) {
    try {
      const h = JSON.parse(localStorage.getItem("quiz-historique:" + id)) || [];
      return h.length ? Math.max(...h.map(x => x.n)) : null;
    } catch (e) { return null; }
  }
  let unlocked = load();

  const $ = (id) => document.getElementById(id);
  const nav = $("nav"), head = $("head"), view = $("view");
  const form = $("f"), input = $("code"), msg = $("msg");

  function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function say(text, cls) { msg.textContent = text; msg.className = cls || ""; }
  function countLabel(n) { return n + " ressource" + (n > 1 ? "s" : ""); }
  function fmt(n) { return String(n).replace(".", ","); }

  function route() {
    const [c, k, s] = location.hash.replace(/^#\/?/, "").split("/");
    const cls = CLASSES.find(x => x.id === c);
    const course = cls && cls.courses.find(x => x.id === k);
    const seq = course && SEQUENCES.find(x => x.cls === cls.id && x.course === course.id && x.id === s);
    return { cls, course, seq };
  }

  function card({ tag = "div", href, cls = "", color, emoji, title, desc, state, blank }) {
    const el = document.createElement(tag);
    el.className = "card " + cls;
    if (href) el.href = href;
    if (blank) { el.target = "_blank"; el.rel = "noopener"; }
    if (color) el.style.setProperty("--c", color);
    el.innerHTML =
      '<span class="stripe"></span>' +
      (state ? '<span class="state">' + esc(state) + '</span>' : '') +
      '<span class="emoji">' + emoji + '</span>' +
      '<h2>' + esc(title) + '</h2>' + (desc ? '<p>' + esc(desc) + '</p>' : '');
    return el;
  }

  function resourceCard(r, popId) {
    if (r.type === "jeu") {
      const open = unlocked.includes(r.id);
      const el = card({ tag: open ? "a" : "div", href: open ? r.url : null,
        cls: (open ? "go" : "locked") + (r.id === popId ? " pop" : ""), color: r.color,
        emoji: r.emoji, title: r.title, desc: r.desc, state: open ? "Jouer ▸" : "🔒 Verrouillé" });
      if (!open) el.addEventListener("click", () => { input.focus(); say("Ce jeu est verrouillé : entre son code.", "err"); });
      return el;
    }
    let state = "Ouvrir ▸";
    if (r.type === "quiz") { const b = quizBest(r.id); state = b === null ? "À faire ▸" : "Record " + fmt(b) + "/20"; }
    if (r.type === "fiche") state = "PDF ▸";
    return card({ tag: "a", href: r.url, cls: "go", color: r.color, emoji: r.emoji,
      title: r.title, desc: r.desc, state, blank: r.type === "fiche" });
  }

  // Affiche une liste de ressources rangées par type, avec un titre par type
  function sections(list, popId) {
    const frag = document.createDocumentFragment();
    for (const t of TYPES) {
      const items = list.filter(r => r.type === t.id);
      if (!items.length) continue;
      const h = document.createElement("div");
      h.className = "section"; h.textContent = t.label;
      frag.appendChild(h);
      const grid = document.createElement("div"); grid.className = "grid";
      items.forEach(r => grid.appendChild(resourceCard(r, popId)));
      frag.appendChild(grid);
    }
    return frag;
  }

  function empty(text) {
    const d = document.createElement("div");
    d.className = "empty";
    d.innerHTML = '<span class="emoji">🚧</span><strong>Bientôt disponible</strong><br>' + esc(text);
    return d;
  }

  function courseLabel(k) { return k.name === "Enseignement pro" ? k.name + " · " + k.sub : k.name; }

  function render(popId) {
    const { cls, course, seq } = route();
    document.documentElement.style.setProperty("--c", cls ? cls.color : "");
    view.innerHTML = "";

    // Fil d'Ariane
    const crumbs = [];
    if (cls) crumbs.push({ href: "#" + cls.id, label: cls.name });
    if (course) crumbs.push({ href: "#" + cls.id + "/" + course.id, label: courseLabel(course) });
    if (seq) crumbs.push({ label: seq.name });
    if (!crumbs.length) nav.innerHTML = "";
    else {
      const back = crumbs.length > 1 ? crumbs[crumbs.length - 2].href : "#";
      nav.innerHTML = '<a class="back" href="' + back + '" aria-label="Retour">←</a><a href="#">Accueil</a>' +
        crumbs.map((c, n) => '<span class="sep">›</span>' + (n === crumbs.length - 1
          ? '<span class="here">' + esc(c.label) + '</span>'
          : '<a href="' + c.href + '">' + esc(c.label) + '</a>')).join("");
    }

    if (!cls) {
      // ACCUEIL : choix de la classe
      head.innerHTML = '<span class="badge">Salle de jeux</span><h1>Choisis ta classe</h1>' +
        '<p>Jeux, quiz et fiches de révision, rangés par cours.</p>';
      const grid = document.createElement("div"); grid.className = "grid";
      for (const c of CLASSES) {
        const n = RESSOURCES.filter(r => r.cls === c.id).length;
        grid.appendChild(card({ tag: "a", href: "#" + c.id, cls: "big go", color: c.color,
          emoji: c.emoji, title: c.name, desc: c.full, state: countLabel(n) }));
      }
      view.appendChild(grid);
      return;
    }

    if (!course) {
      // CLASSE : choix du cours
      head.innerHTML = '<span class="badge">' + esc(cls.name) + '</span><h1>Choisis ton cours</h1><p>' + esc(cls.full) + '</p>';
      const grid = document.createElement("div"); grid.className = "grid";
      for (const k of cls.courses) {
        const n = RESSOURCES.filter(r => r.cls === cls.id && r.course === k.id).length;
        grid.appendChild(card({ tag: "a", href: "#" + cls.id + "/" + k.id, cls: n ? "go" : "soon",
          color: cls.color, emoji: k.emoji, title: k.name, desc: k.sub, state: n ? countLabel(n) : "Bientôt" }));
      }
      view.appendChild(grid);
      return;
    }

    if (!seq) {
      // COURS : séquences + ressources hors séquence
      head.innerHTML = '<span class="badge">' + esc(cls.name) + '</span><h1>' + esc(course.name) + '</h1><p>' + esc(course.sub || "") + '</p>';
      const seqs = SEQUENCES.filter(s => s.cls === cls.id && s.course === course.id);
      const loose = RESSOURCES.filter(r => r.cls === cls.id && r.course === course.id && !r.seq);
      if (!seqs.length && !loose.length) { view.appendChild(empty("Aucune ressource pour ce cours pour l'instant.")); return; }
      if (seqs.length) {
        const h = document.createElement("div"); h.className = "section"; h.textContent = "📚 Séquences";
        view.appendChild(h);
        const grid = document.createElement("div"); grid.className = "grid";
        seqs.forEach((s, n) => {
          const count = RESSOURCES.filter(r => r.cls === cls.id && r.course === course.id && r.seq === s.id).length;
          grid.appendChild(card({ tag: "a", href: "#" + cls.id + "/" + course.id + "/" + s.id, cls: count ? "go" : "soon",
            color: cls.color, emoji: s.emoji, title: s.name, desc: s.notions, state: count ? countLabel(count) : "Bientôt" }));
        });
        view.appendChild(grid);
      }
      view.appendChild(sections(loose, popId));
      return;
    }

    // SÉQUENCE : ressources par type
    head.innerHTML = '<span class="badge">' + esc(cls.name + " · " + courseLabel(course)) + '</span><h1>' + esc(seq.name) + '</h1><p>' + esc(seq.notions || "") + '</p>';
    const list = RESSOURCES.filter(r => r.cls === cls.id && r.course === course.id && r.seq === seq.id);
    if (!list.length) { view.appendChild(empty("Aucune ressource pour cette séquence pour l'instant.")); return; }
    view.appendChild(sections(list, popId));
  }

  function normalize(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
  }

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = normalize(input.value);
    if (!code) return;
    let h;
    try { h = await sha256("jeux:" + code); }
    catch (err) { say("Ton navigateur ne peut pas vérifier le code. Essaie un autre navigateur.", "err"); return; }
    const g = RESSOURCES.find(x => x.type === "jeu" && x.hash === h);
    if (!g) {
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
      say("Code inconnu… vérifie l'orthographe.", "err");
      return;
    }
    if (!unlocked.includes(g.id)) { unlocked.push(g.id); save(unlocked); }
    input.value = "";
    say("🎉 « " + g.title + " » débloqué ! Ouverture…", "ok");
    const target = "#" + [g.cls, g.course, g.seq].filter(Boolean).join("/");
    if (location.hash !== target) history.replaceState(null, "", target);
    render(g.id);
    setTimeout(() => { location.href = g.url; }, 900);
  });

  form.addEventListener("animationend", () => form.classList.remove("shake"));
  window.addEventListener("hashchange", () => { say(""); render(); window.scrollTo(0, 0); });
  window.addEventListener("pageshow", (e) => { if (e.persisted) render(); }); // rafraîchit les records au retour d'un quiz

  $("reset").addEventListener("click", () => {
    unlocked = []; save(unlocked); render(); say("Tous les jeux sont de nouveau verrouillés.", "");
  });

  render();
</script>
</body>
</html>
