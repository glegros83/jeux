<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salle de jeux</title>
<meta name="description" content="Cours, jeux, quiz et fiches de révision pour PMCV2 et SMRC2.">
<meta name="theme-color" content="#160d2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salle de jeux">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bangers&family=Nunito:wght@500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* ===== Habillage : borne d'arcade pixel × BD ===== */
  :root {
    --night: #160d2c; --night2: #241447; --ink: #0b0716; --paper: #fff8e7; --muted: #5d5470;
    --yellow: #ffd23f; --pink: #ff3e8a; --cyan: #29d3f5; --green: #3ddc84;
    --pixel: "Press Start 2P", ui-monospace, monospace;
    --comic: "Bangers", Impact, "Arial Black", sans-serif;
    --sh: 5px 5px 0 #000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--night);
    background-image:
      radial-gradient(rgba(255,255,255,.09) 1.2px, transparent 1.7px),
      radial-gradient(circle at 50% -10%, var(--night2), transparent 65%);
    background-size: 14px 14px, 100% 100%;
    background-attachment: fixed;
    color: var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  }
  /* lignes de balayage façon écran cathodique */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  }
  a { color: inherit; }

  /* ---------- Fronton de la borne (barre du haut) ---------- */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #2b1656, #0f0820);
    border-bottom: 4px solid #000; box-shadow: 0 4px 0 var(--pink);
    padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
  }
  .bar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 46px; }
  .bar .back {
    flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--yellow); color: #000; border: 3px solid #000; border-radius: 4px; box-shadow: 3px 3px 0 #000;
    text-decoration: none; font: 16px var(--pixel); padding-top: 2px;
  }
  .bar .back:active { transform: translate(3px, 3px); box-shadow: none; }
  .bar .ttl { min-width: 0; flex: 1; }
  .bar .ttl small { display: block; font: 8px/1.6 var(--pixel); color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
  .bar .ttl b { display: block; font: 24px/1.05 var(--comic); letter-spacing: .5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 2px 2px 0 #000; }
  .brand { display: flex; align-items: center; gap: 12px; font: 13px/1.4 var(--pixel); color: var(--yellow); text-shadow: 3px 3px 0 var(--pink); }
  .brand img { width: 38px; height: 38px; border: 3px solid #000; border-radius: 4px; box-shadow: 3px 3px 0 #000; }

  main { max-width: 720px; margin: 0 auto; padding: 22px 16px calc(env(safe-area-inset-bottom) + 48px); }

  /* ---------- Titres BD + bulles ---------- */
  .hero { margin: 4px 0 22px; }
  .hero h1 {
    font: clamp(40px, 12vw, 64px)/.95 var(--comic); letter-spacing: 1px; margin: 0 0 14px; color: #fff;
    -webkit-text-stroke: 2px #000; paint-order: stroke fill;
    text-shadow: 4px 4px 0 var(--c, var(--pink)), 6px 6px 0 #000;
  }
  .hero p {
    position: relative; display: inline-block; margin: 0 0 6px; max-width: 100%;
    background: var(--paper); color: var(--ink); font-weight: 700; font-size: 15px; line-height: 1.35;
    border: 3px solid #000; border-radius: 16px; padding: 10px 14px; box-shadow: 4px 4px 0 #000;
  }
  .hero p::before, .hero p::after { content: ""; position: absolute; left: 22px; width: 0; height: 0; border-style: solid; }
  .hero p::before { top: -16px; border-width: 0 10px 16px 6px; border-color: transparent transparent #000 transparent; }
  .hero p::after { top: -10px; left: 25px; border-width: 0 6px 11px 3px; border-color: transparent transparent var(--paper) transparent; }
  .chip-c {
    display: inline-block; font: 9px/1 var(--pixel); text-transform: uppercase; color: #fff;
    background: var(--c, var(--pink)); border: 3px solid #000; padding: 7px 9px 6px; margin-bottom: 14px;
    box-shadow: 3px 3px 0 #000; transform: rotate(-2deg); text-shadow: 1px 1px 0 #000;
  }
  .press { font: 11px var(--pixel); color: var(--yellow); margin: 0 0 14px; text-shadow: 2px 2px 0 #000; animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  /* ---------- Gros boutons de borne (classes) ---------- */
  .tiles { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 560px) { .tiles { grid-template-columns: 1fr 1fr; } }
  .tile {
    position: relative; display: block; text-decoration: none; overflow: visible;
    background: var(--c); color: #fff; border: 4px solid #000; border-radius: 6px;
    padding: 18px 18px 16px; box-shadow: 6px 6px 0 #000; min-height: 136px;
  }
  .tile::before { /* trame BD */
    content: ""; position: absolute; inset: 0; border-radius: 2px; pointer-events: none;
    background: radial-gradient(rgba(0,0,0,.18) 1.4px, transparent 1.9px) 0 0 / 9px 9px;
    -webkit-mask-image: linear-gradient(135deg, transparent 35%, #000); mask-image: linear-gradient(135deg, transparent 35%, #000);
  }
  .tile .em { position: relative; font-size: 34px; line-height: 1; filter: drop-shadow(2px 2px 0 #000); }
  .tile h2 { position: relative; margin: 14px 0 8px; font: 22px/1.1 var(--pixel); text-shadow: 3px 3px 0 #000; }
  .tile p { position: relative; margin: 0; font-size: 14px; font-weight: 700; line-height: 1.3; text-shadow: 1px 1px 0 rgba(0,0,0,.5); padding-right: 6px; }
  .tile .n { /* étoile « POW » */
    position: absolute; top: -18px; right: -10px; width: 86px; height: 86px; display: flex; align-items: center; justify-content: center;
    text-align: center; font: 17px/1 var(--comic); letter-spacing: .5px; color: #000; background: var(--yellow); padding: 0 14px;
    clip-path: polygon(50% 0%, 61% 18%, 82% 9%, 79% 31%, 100% 38%, 84% 54%, 96% 74%, 73% 75%, 68% 98%, 50% 84%, 32% 98%, 27% 75%, 4% 74%, 16% 54%, 0% 38%, 21% 31%, 18% 9%, 39% 18%);
    filter: drop-shadow(3px 3px 0 #000); transform: rotate(10deg);
  }
  .tile:active { transform: translate(5px, 5px); box-shadow: 1px 1px 0 #000; }

  /* ---------- « CONTINUE ? » ---------- */
  .resume {
    display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff;
    background: #000; border: 3px solid var(--c); border-radius: 6px; box-shadow: 5px 5px 0 var(--c);
    padding: 12px 14px; margin-bottom: 22px;
  }
  .resume .ic { width: 44px; height: 44px; border-radius: 4px; border: 3px solid #fff; background: var(--c); display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
  .resume small { display: block; font: 9px/1.6 var(--pixel); color: var(--yellow); animation: blink 1.1s steps(2, start) infinite; }
  .resume b { display: block; font-size: 16px; }
  .resume .go { margin-left: auto; font: 16px var(--pixel); color: var(--c); }
  .resume:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--c); }

  /* ---------- Cases de BD (listes) ---------- */
  .sec { display: flex; align-items: center; gap: 10px; margin: 28px 0 12px; font: 10px/1.6 var(--pixel); color: var(--yellow); text-transform: uppercase; text-shadow: 2px 2px 0 #000; }
  .sec:first-child { margin-top: 0; }
  .sec::after { content: ""; flex: 1; height: 4px; background: repeating-linear-gradient(90deg, var(--yellow) 0 6px, transparent 6px 12px); opacity: .7; }
  .list { display: grid; gap: 14px; }
  .row {
    display: flex; align-items: center; gap: 12px; min-height: 70px; text-decoration: none; width: 100%; text-align: left;
    background: var(--paper); color: var(--ink); border: 3px solid #000; border-radius: 6px; box-shadow: var(--sh);
    padding: 10px 12px; cursor: pointer; font: inherit;
  }
  .row:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 #000; }
  .row .ic {
    flex: none; width: 48px; height: 48px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; background: var(--c); border: 3px solid #000; box-shadow: 2px 2px 0 #000;
  }
  .row .tx { flex: 1; min-width: 0; }
  .row .tx b { display: block; font-size: 16px; font-weight: 800; line-height: 1.25; }
  .row .tx small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 13px; line-height: 1.3; margin-top: 3px; }
  .row .rt {
    flex: none; font: 9px/1 var(--pixel); text-transform: uppercase; white-space: nowrap;
    background: var(--c); color: #fff; border: 2px solid #000; padding: 7px 7px 6px; text-shadow: 1px 1px 0 #000; box-shadow: 2px 2px 0 #000;
  }
  .row.off { background: #2a2340; color: #a39bbb; box-shadow: none; border-style: dashed; cursor: default; }
  .row.off .ic { filter: grayscale(1); opacity: .5; box-shadow: none; }
  .row.off .tx small { color: #8a83a0; }
  .row.off .rt, .row.soon .rt { background: #4a4360; color: #d6d0e6; }
  .row.off:active { transform: none; box-shadow: none; }

  .empty { text-align: center; color: var(--ink); background: var(--paper); border: 3px dashed #000; border-radius: 6px; padding: 28px 18px; box-shadow: var(--sh); }
  .empty .em { font-size: 40px; display: block; margin-bottom: 8px; }
  .empty strong { font: 26px var(--comic); letter-spacing: .5px; }

  /* ---------- Installer + bulle d'info ---------- */
  .install {
    display: none; align-items: center; gap: 12px; margin-top: 30px; padding: 12px 14px;
    background: var(--paper); color: var(--ink); border: 3px solid #000; border-radius: 6px; box-shadow: var(--sh); font-size: 14px;
  }
  .install.show { display: flex; }
  .install button { margin-left: auto; flex: none; border: 3px solid #000; border-radius: 4px; background: var(--green); color: #000; font: 9px var(--pixel); padding: 10px 10px; cursor: pointer; box-shadow: 2px 2px 0 #000; }
  .credits { text-align: center; margin-top: 30px; font: 9px/1.8 var(--pixel); color: rgba(255,255,255,.45); }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translate(-50%, 20px) rotate(-1deg);
    background: var(--yellow); color: #000; font: 21px/1.15 var(--comic); letter-spacing: .5px; padding: 12px 18px;
    border: 3px solid #000; border-radius: 14px; box-shadow: 4px 4px 0 #000;
    opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100% - 32px); text-align: center; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) rotate(-1deg); }

  /* ---------- Lexique ---------- */
  .lexbox { margin-top: 28px; background: var(--paper); color: var(--ink); border: 3px solid #000; border-radius: 6px; box-shadow: var(--sh); }
  .lexbox > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px; font: 10px/1.6 var(--pixel); text-transform: uppercase; }
  .lexbox > summary::-webkit-details-marker { display: none; }
  .lexbox > summary::after { content: "▼"; margin-left: auto; font-size: 10px; }
  .lexbox[open] > summary::after { content: "▲"; }
  .lexbox > summary .cnt { background: var(--c, var(--pink)); color: #fff; border: 2px solid #000; padding: 4px 6px 3px; font-size: 9px; }
  .lex-list { padding: 0 14px 6px; }
  .lex-item { border-top: 2px dashed rgba(0,0,0,.18); padding: 11px 0; }
  .lex-item b { display: block; font-size: 17px; line-height: 1.25; }
  .lex-item p { margin: 3px 0 0; font-size: 15px; line-height: 1.45; }
  .lex-item .ex { font-style: italic; color: var(--muted); }
  .lex-item .src { display: inline-block; margin-top: 5px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .lexmini { margin: -4px 6px 0 14px; background: var(--paper); color: var(--ink); border: 3px solid #000; border-top: 0; border-radius: 0 0 6px 6px; }
  .lexmini > summary { list-style: none; cursor: pointer; padding: 8px 12px; font: 8px/1.6 var(--pixel); text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
  .lexmini > summary::-webkit-details-marker { display: none; }
  .lexmini > summary::after { content: "▼"; margin-left: auto; }
  .lexmini[open] > summary::after { content: "▲"; }
  .lexmini .lex-list { padding: 0 12px 4px; }
  .lexmini .lex-item b { font-size: 16px; }
  .lexmini .lex-item p { font-size: 14px; }
  .with-lex { display: grid; }
  html.calm .lexmini { border: 1px solid rgba(0,0,0,.1); border-top: 0; border-radius: 0 0 14px 14px; margin: -8px 10px 0; padding-top: 6px; }
  html.calm .lexmini > summary { font: 800 13px/1.4 var(--pixel); text-transform: none; }
  html[data-skin="lisible"] .lexmini { border: 2px solid #000; border-top: 0; }
  html[data-skin="lisible"] .lexmini > summary { font-size: 15px; }
  .lex-search { width: 100%; font: 600 17px system-ui, sans-serif; padding: 13px 14px; margin: 0 0 16px; color: var(--ink); background: var(--paper); border: 3px solid #000; border-radius: 6px; box-shadow: 4px 4px 0 #000; }
  .lex-letter { font: 14px var(--pixel); color: var(--yellow); text-shadow: 2px 2px 0 #000; margin: 22px 0 8px; }
  .lex-card { background: var(--paper); color: var(--ink); border: 3px solid #000; border-radius: 6px; box-shadow: var(--sh); padding: 0 14px; }
  .lex-card .lex-item:first-child { border-top: 0; }
  .lex-none { color: var(--muted); text-align: center; padding: 20px; }
  html.calm .lexbox, html.calm .lex-card { border: 1px solid rgba(0,0,0,.1); border-radius: 16px; }
  html.calm .lexbox > summary { font: 800 14px/1.4 var(--pixel); text-transform: none; }
  html.calm .lexbox > summary .cnt { border: 0; border-radius: 999px; font-size: 12px; padding: 4px 9px; }
  html.calm .lex-item { border-top: 1px solid rgba(0,0,0,.08); }
  html.calm .lex-search { border: 1px solid rgba(0,0,0,.18); border-radius: 14px; box-shadow: none; font-family: var(--pixel); }
  html.calm .lex-letter { font: 900 20px var(--pixel); color: var(--ink); text-shadow: none; }
  html[data-skin="lisible"] .lexbox, html[data-skin="lisible"] .lex-card, html[data-skin="lisible"] .lex-search { border: 2px solid #000; }
  html[data-skin="lisible"] .lex-item b { font-size: 20px; }
  html[data-skin="lisible"] .lex-item p { font-size: 18px; color: #000; }
  @media (prefers-reduced-motion: reduce) { .press, .resume small { animation: none; } }

  /* ===== Bouton et panneau « Affichage » ===== */
  .skin-btn {
    flex: none; margin-left: auto; height: 44px; min-width: 44px; padding: 0 10px; cursor: pointer;
    background: var(--cyan); color: #000; border: 3px solid #000; border-radius: 4px; box-shadow: 3px 3px 0 #000;
    font: 10px var(--pixel); display: inline-flex; align-items: center; gap: 6px;
  }
  .skin-hint {
    position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 70px); right: 12px; max-width: 250px; cursor: pointer;
    background: var(--yellow); color: #000; border: 3px solid #000; border-radius: 12px; box-shadow: 4px 4px 0 #000;
    padding: 10px 12px; font: 700 14px/1.35 system-ui, sans-serif; animation: hintIn .35s ease-out;
  }
  .skin-hint::before { content: ""; position: absolute; top: -13px; right: 26px; border: solid transparent; border-width: 0 9px 12px; border-bottom-color: #000; }
  .skin-hint::after { content: ""; position: absolute; top: -8px; right: 29px; border: solid transparent; border-width: 0 6px 9px; border-bottom-color: var(--yellow); }
  .skin-hint b { display: block; font-size: 15px; }
  @keyframes hintIn { from { opacity: 0; transform: translateY(-6px); } }
  html.calm .skin-hint { background: var(--ink); color: #fff; border: 0; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  html.calm .skin-hint::before { border-bottom-color: var(--ink); }
  html.calm .skin-hint::after { display: none; }
  .skin-btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .sheet-bg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: none; }
  .sheet-bg.show { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; max-width: 560px; margin: 0 auto;
    background: var(--paper); color: var(--ink); border: 3px solid #000; border-bottom: 0; border-radius: 14px 14px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); transform: translateY(105%); transition: transform .22s;
  }
  .sheet.show { transform: none; }
  .sheet h3 { margin: 0 0 4px; font: 26px var(--comic); letter-spacing: .5px; }
  .sheet p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .skin-opt {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; margin-bottom: 10px;
    padding: 12px 14px; border: 3px solid #000; border-radius: 8px; background: #fff; color: #111; font: inherit;
  }
  .skin-opt b { display: block; font-size: 17px; }
  .skin-opt small { color: #555; font-size: 14px; }
  .skin-opt .sw { flex: none; width: 54px; height: 54px; border-radius: 8px; border: 2px solid #000; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .skin-opt.on { outline: 4px solid var(--pink); outline-offset: 2px; }
  .skin-opt .ck { margin-left: auto; font-size: 22px; visibility: hidden; }
  .skin-opt.on .ck { visibility: visible; }

  /* ===================================================================
     STYLES CALMES : « Doux » et « Lecture facile » (classe .calm)
     =================================================================== */
  html.calm { --pixel: "Nunito", system-ui, sans-serif; --comic: "Nunito", system-ui, sans-serif;
    --paper: #ffffff; --ink: #26213a; --muted: #5f5a70; --sh: 0 4px 14px rgba(40,30,80,.10); }
  html.calm body { background: #f6f2ea; background-image: none; color: var(--ink); }
  html.calm body::after, html.calm .press, html.calm .credits { display: none; }
  html.calm .bar { background: #fffaf2; border-bottom: 1px solid rgba(0,0,0,.1); box-shadow: none; }
  html.calm .brand { font: 800 19px var(--pixel); color: var(--ink); text-shadow: none; }
  html.calm .brand img { border: 0; border-radius: 10px; box-shadow: none; }
  html.calm .bar .back { background: #fff; color: var(--ink); border: 1px solid rgba(0,0,0,.18); border-radius: 12px; box-shadow: none; font: 800 22px var(--pixel); padding: 0; }
  html.calm .bar .ttl small { font: 700 12px/1.4 var(--pixel); color: var(--muted); text-transform: none; }
  html.calm .bar .ttl b { font: 800 18px/1.25 var(--pixel); color: var(--ink); text-shadow: none; letter-spacing: 0; }
  html.calm .skin-btn { background: #fff; color: var(--ink); border: 1px solid rgba(0,0,0,.18); border-radius: 12px; box-shadow: none; font: 800 14px var(--pixel); }
  html.calm .hero h1 { font: 800 clamp(30px, 8vw, 42px)/1.1 var(--pixel); color: var(--ink); -webkit-text-stroke: 0; text-shadow: none; letter-spacing: -.01em; }
  html.calm .hero p { background: none; border: 0; box-shadow: none; padding: 0; color: var(--muted); font-weight: 500; font-size: 16px; }
  html.calm .hero p::before, html.calm .hero p::after { display: none; }
  html.calm .chip-c { font: 800 12px/1 var(--pixel); letter-spacing: .06em; background: none; color: var(--c, var(--ink)); border: 2px solid var(--c, var(--ink)); border-radius: 999px; box-shadow: none; transform: none; text-shadow: none; padding: 5px 10px; }
  html.calm .tile { border: 0; border-radius: 20px; box-shadow: 0 8px 22px rgba(0,0,0,.14); }
  html.calm .tile::before { display: none; }
  html.calm .tile .em { filter: none; }
  html.calm .tile h2 { font: 900 28px/1.1 var(--pixel); text-shadow: none; }
  html.calm .tile p { text-shadow: none; font-weight: 600; padding-right: 96px; }
  html.calm .tile .n { clip-path: none; filter: none; transform: none; width: auto; height: auto; top: auto; right: 14px; bottom: 14px;
    background: rgba(0,0,0,.22); color: #fff; font: 800 13px var(--pixel); letter-spacing: 0; border-radius: 999px; padding: 5px 10px; }
  html.calm .tile:active, html.calm .row:active, html.calm .resume:active { transform: scale(.985); }
  html.calm .resume { background: #fff; color: var(--ink); border: 0; border-radius: 16px; box-shadow: var(--sh); }
  html.calm .resume .ic { border: 0; border-radius: 12px; }
  html.calm .resume small { font: 800 12px var(--pixel); color: var(--muted); animation: none; }
  html.calm .resume .go { font: 800 24px var(--pixel); }
  html.calm .sec { font: 800 13px/1.4 var(--pixel); color: var(--muted); text-shadow: none; letter-spacing: .06em; }
  html.calm .sec::after { height: 1px; background: rgba(0,0,0,.12); opacity: 1; }
  html.calm .row { background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 16px; box-shadow: var(--sh); }
  html.calm .row .ic { border: 0; border-radius: 12px; box-shadow: none; background: #eee; background: color-mix(in srgb, var(--c) 20%, #fff); }
  html.calm .row .rt { font: 800 12px/1 var(--pixel); text-transform: none; border: 0; border-radius: 999px; text-shadow: none; box-shadow: none; padding: 7px 11px; }
  html.calm .row.off { background: #efebe3; color: #77718a; border: 1px dashed rgba(0,0,0,.22); }
  html.calm .row.off .rt, html.calm .row.soon .rt { background: #e2ddd2; color: #5f5a70; }
  html.calm .empty { border: 2px dashed rgba(0,0,0,.15); box-shadow: none; }
  html.calm .empty strong { font: 800 19px var(--pixel); }
  html.calm .install { border: 1px dashed rgba(0,0,0,.2); box-shadow: none; border-radius: 16px; }
  html.calm .install button { font: 800 14px var(--pixel); border: 0; border-radius: 10px; box-shadow: none; background: var(--ink); color: #fff; }
  html.calm .toast { font: 700 15px/1.3 var(--pixel); letter-spacing: 0; background: var(--ink); color: #fff; border: 0; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transform: translate(-50%, 20px); }
  html.calm .toast.show { transform: translate(-50%, 0); }
  html.calm .sheet { border: 0; box-shadow: 0 -10px 30px rgba(0,0,0,.2); }
  html.calm .sheet h3 { font: 800 22px var(--pixel); }

  /* ---------- Lecture facile : contraste maximal, texte plus grand ---------- */
  html.calm[data-skin="lisible"] { --pixel: "Atkinson Hyperlegible", Verdana, sans-serif; --ink: #000; --muted: #2b2b2b; --sh: none; }
  html[data-skin="lisible"] body { background: #fff; font-size: 18px; line-height: 1.5; }
  html[data-skin="lisible"] .bar { background: #fff; border-bottom: 3px solid #000; }
  html[data-skin="lisible"] .bar .back, html[data-skin="lisible"] .skin-btn { border: 2px solid #000; }
  html[data-skin="lisible"] .bar .ttl small { font-size: 14px; color: #000; }
  html[data-skin="lisible"] .bar .ttl b { font-size: 20px; }
  html[data-skin="lisible"] .hero p { font-size: 18px; color: #000; }
  html[data-skin="lisible"] .chip-c { color: #000; border-color: #000; font-size: 14px; }
  html[data-skin="lisible"] .tile { background: #fff; color: #000; border: 3px solid #000; border-left: 14px solid var(--c); border-radius: 12px; box-shadow: none; }
  html[data-skin="lisible"] .tile p { font-size: 17px; }
  html[data-skin="lisible"] .tile .n { background: #000; font-size: 15px; }
  html[data-skin="lisible"] .resume, html[data-skin="lisible"] .row { border: 2px solid #000; box-shadow: none; }
  html[data-skin="lisible"] .row { min-height: 76px; }
  html[data-skin="lisible"] .row .tx b { font-size: 19px; }
  html[data-skin="lisible"] .row .tx small { display: block; -webkit-line-clamp: unset; font-size: 16px; color: #2b2b2b; }
  html[data-skin="lisible"] .row .rt { background: #000; color: #fff; font-size: 14px; }
  html[data-skin="lisible"] .row .ic { border: 2px solid #000; }
  html[data-skin="lisible"] .row.off { background: #f2f2f2; color: #333; border: 2px dashed #000; }
  html[data-skin="lisible"] .row.off .ic { opacity: .7; }
  html[data-skin="lisible"] .row.off .rt { background: #fff; color: #000; border: 2px solid #000; }
  html[data-skin="lisible"] .sec { font-size: 15px; color: #000; }
  html[data-skin="lisible"] .sec::after { height: 2px; background: #000; }
  html[data-skin="lisible"] .toast { font-size: 18px; background: #000; }
  html[data-skin="lisible"] a:focus-visible, html[data-skin="lisible"] button:focus-visible { outline: 4px solid #1a5fd0; outline-offset: 3px; }
</style>
<script>
  (function () {
    var s = "arcade";
    try { s = localStorage.getItem("salle-skin") || "arcade"; } catch (e) {}
    if (["arcade", "doux", "lisible"].indexOf(s) < 0) s = "arcade";
    document.documentElement.dataset.skin = s;
    if (s !== "arcade") document.documentElement.classList.add("calm");
  })();
</script>
</head>
<body>
<header class="bar"><div class="bar-in" id="bar"></div></header>
<main>
  <div id="view"></div>
  <div class="install" id="install"></div>
</main>
<div class="toast" id="toast" role="status"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Choisir l'affichage"></div>

<script src="catalogue.js"></script>
<script>
  const { CLASSES, SEQUENCES, RESSOURCES } = window.CATALOGUE;
  const A = window.ACCES;
  const TYPES = [
    { id: "cours", label: "📖 Cours en ligne" },
    { id: "fiche", label: "📄 Fiches de révision" },
    { id: "quiz",  label: "🧠 Quiz" },
    { id: "jeu",   label: "🎮 Jeux" },
  ];

  /* ---------- Stockage local (toujours protégé) ---------- */
  function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  /* ---------- État ouvert / à venir / masqué ---------- */
  let ETAT = lsGet("salle-etat-cache", null) || { sequences: {}, ressources: {} };
  let etatLoaded = !!lsGet("salle-etat-cache", null);
  let LEX = lsGet("salle-lex-cache", null) || { mots: [] };
  async function loadLex() {
    try {
      const r = await fetch("lexique.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const l = await r.json();
      if (JSON.stringify(l) !== JSON.stringify(LEX)) { LEX = l; lsSet("salle-lex-cache", l); if (etatLoaded) render(); }
    } catch (e) {}
  }
  function wordOpen(w) {
    if (w.seq) { const s = SEQUENCES.find(x => A.seqKey(x) === w.seq); return !!s && A.seqState(ETAT, s) === "ouvert"; }
    if (w.res) { const r = RESSOURCES.find(x => x.id === w.res); return !!r && A.resState(ETAT, r) === "ouvert"; }
    return true;
  }
  function wordSource(w) {
    if (w.seq) { const s = SEQUENCES.find(x => A.seqKey(x) === w.seq); return s ? s.emoji + " " + s.name : ""; }
    if (w.res) {
      const r = RESSOURCES.find(x => x.id === w.res);
      if (!r) return "";
      const s = r.seq && SEQUENCES.find(x => x.cls === r.cls && x.course === r.course && x.id === r.seq);
      return (s ? s.emoji + " " + s.name + " › " : "") + r.emoji + " " + r.title;
    }
    return "";
  }
  function resSource(w) {
    const r = w.res && RESSOURCES.find(x => x.id === w.res);
    return r ? r.emoji + " " + r.title : "";
  }
  const resWords = (r) => (LEX.mots || []).filter(w => w.res === r.id && wordOpen(w));
  // Petit lexique replié, affiché juste sous la ligne d'une activité
  function withLex(r, el) {
    const ws = A.resState(ETAT, r) === "ouvert" ? resWords(r) : [];
    if (!ws.length) return el;
    const box = document.createElement("div");
    box.className = "with-lex";
    const d = document.createElement("details");
    d.className = "lexmini";
    d.innerHTML = '<summary>📖 ' + esc(px("Lexique de l'activité")) + ' (' + ws.length + ')</summary><div class="lex-list">' +
      ws.slice().sort(byWord).map(w => lexItem(w, false)).join("") + '</div>';
    box.appendChild(el); box.appendChild(d);
    return box;
  }
  const norm = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const byWord = (a, b) => a.mot.localeCompare(b.mot, "fr", { sensitivity: "base" });
  function lexItem(w, withSource) {
    return '<div class="lex-item"><b>' + esc(w.mot) + '</b><p>' + esc(w.def) + '</p>' +
      (w.ex ? '<p class="ex">Exemple : ' + esc(w.ex) + '</p>' : '') +
      (withSource ? (function () { const s = typeof withSource === "function" ? withSource(w) : wordSource(w); return s ? '<span class="src">Vu dans : ' + esc(s) + '</span>' : ''; })() : '') + '</div>';
  }
  function lexBox(words, title, withSource) {
    const d = document.createElement("details");
    d.className = "lexbox"; d.open = words.length <= 6;
    d.innerHTML = '<summary>📖 ' + esc(px(title)) + ' <span class="cnt">' + words.length + '</span></summary>' +
      '<div class="lex-list">' + words.slice().sort(byWord).map(w => lexItem(w, withSource)).join("") + '</div>';
    return d;
  }
  function renderLexPage(cls) {
    setBar("#" + cls.id, cls.name, "Lexique");
    document.title = "Lexique " + cls.name;
    const words = (LEX.mots || []).filter(w => w.cls === cls.id && wordOpen(w)).sort(byWord);
    view.insertAdjacentHTML("beforeend", '<div class="hero"><span class="chip-c">' + esc(cls.name) + '</span><h1>Lexique</h1><p>Tous les mots vus dans les séquences et activités ouvertes. ' + words.length + ' mot' + (words.length > 1 ? 's' : '') + '.</p></div>');
    if (!words.length) { view.appendChild(empty("Aucun mot pour l'instant.")); return; }
    const inp = document.createElement("input");
    inp.className = "lex-search"; inp.type = "search"; inp.placeholder = "🔍 Chercher un mot…"; inp.setAttribute("aria-label", "Chercher un mot");
    const out = document.createElement("div");
    view.appendChild(inp); view.appendChild(out);
    function draw() {
      const q = norm(inp.value.trim());
      const found = q ? words.filter(w => norm(w.mot).includes(q) || norm(w.def).includes(q)) : words;
      if (!found.length) { out.innerHTML = '<div class="lex-card"><p class="lex-none">Aucun mot ne correspond.</p></div>'; return; }
      const groups = {};
      found.forEach(w => { const L = norm(w.mot).charAt(0).toUpperCase() || "#"; (groups[L] = groups[L] || []).push(w); });
      out.innerHTML = Object.keys(groups).sort().map(L => '<div class="lex-letter">' + esc(L) + '</div><div class="lex-card">' + groups[L].map(w => lexItem(w, true)).join("") + '</div>').join("");
    }
    inp.addEventListener("input", draw);
    draw();
  }
  async function loadEtat() {
    try {
      const r = await fetch("etat.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw 0;
      const e = await r.json();
      const changed = JSON.stringify(e) !== JSON.stringify(ETAT) || !etatLoaded;
      ETAT = e; etatLoaded = true; lsSet("salle-etat-cache", e);
      if (changed) render();
    } catch (err) { if (!etatLoaded) { etatLoaded = true; render(); } }
  }

  /* ---------- Outils ---------- */
  const $ = (id) => document.getElementById(id);
  const bar = $("bar"), view = $("view");
  function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  // la police pixel n'a pas de majuscules accentuées
  function px(s) { if (document.documentElement.dataset.skin !== "arcade") return String(s == null ? "" : s); return String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function fmt(n) { return String(n).replace(".", ","); }
  let toastT;
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200); }
  function quizBest(id) { const h = lsGet("quiz-historique:" + id, []); return h.length ? Math.max(...h.map(x => x.n)) : null; }
  const visibleRes = (list) => list.filter(r => A.resState(ETAT, r) !== "masque");
  const openRes = (list) => list.filter(r => A.resState(ETAT, r) === "ouvert");
  const resOf = (c, k, s) => RESSOURCES.filter(r => r.cls === c && (!k || r.course === k) && (s === undefined || (r.seq || null) === s));
  const seqsOf = (c, k) => SEQUENCES.filter(s => s.cls === c && s.course === k && A.seqState(ETAT, s) !== "masque");
  function courseLabel(k) { return k.name === "Enseignement pro" ? k.name + " · " + k.sub : k.name; }
  function plural(n, w) { return n + " " + w + (n > 1 ? "s" : ""); }

  function route() {
    const [c, k, s] = location.hash.replace(/^#\/?/, "").split("/");
    const cls = CLASSES.find(x => x.id === c);
    const course = cls && cls.courses.find(x => x.id === k);
    const seq = course && SEQUENCES.find(x => x.cls === cls.id && x.course === course.id && x.id === s);
    return { cls, course, seq, lex: !!cls && k === "lexique" };
  }

  function row({ href, color, emoji, title, desc, right, off, soon, blank, onTap }) {
    const el = document.createElement(href && !off ? "a" : "button");
    el.className = "row" + (off ? " off" : "") + (soon ? " soon" : "");
    if (href && !off) { el.href = href; if (blank) { el.target = "_blank"; el.rel = "noopener"; } }
    else el.type = "button";
    el.style.setProperty("--c", color);
    el.innerHTML = '<span class="ic">' + emoji + '</span><span class="tx"><b>' + esc(title) + '</b>' +
      (desc ? '<small>' + esc(desc) + '</small>' : '') + '</span>' + (right ? '<span class="rt">' + esc(px(right)) + '</span>' : '');
    if (onTap) el.addEventListener("click", onTap);
    return el;
  }

  function list(items) { const d = document.createElement("div"); d.className = "list"; items.forEach(i => d.appendChild(i)); return d; }
  function sec(label) { const d = document.createElement("div"); d.className = "sec"; d.textContent = px(label); return d; }
  function empty(text) { const d = document.createElement("div"); d.className = "empty"; d.innerHTML = '<span class="em">🚧</span><strong>Bientôt disponible</strong><br>' + esc(text); return d; }

  function resourceRow(r) {
    const st = A.resState(ETAT, r);
    if (st === "grise") return row({ color: r.color, emoji: r.emoji, title: r.title, desc: r.desc, right: "🔒 À venir", off: true,
      onTap: () => toast("Pas encore ouvert : ton prof l'ouvrira bientôt.") });
    let right = "Ouvrir";
    if (r.type === "jeu") right = "Jouer ▸";
    if (r.type === "fiche") right = "PDF";
    if (r.type === "quiz") { const b = quizBest(r.id); right = b === null ? "À faire" : "★ " + fmt(b) + "/20"; }
    return row({ href: r.url, color: r.color, emoji: r.emoji, title: r.title, desc: r.desc, right, blank: r.type === "fiche" });
  }

  function byType(resList) {
    const frag = document.createDocumentFragment();
    for (const t of TYPES) {
      const items = resList.filter(r => r.type === t.id);
      if (!items.length) continue;
      frag.appendChild(sec(t.label));
      frag.appendChild(list(items.map(r => withLex(r, resourceRow(r)))));
    }
    return frag;
  }

  function setBar(back, small, title) {
    bar.innerHTML = back
      ? '<a class="back" href="' + back + '" aria-label="Retour">‹</a>' +
        '<div class="ttl"><small>' + esc(px(small)) + '</small><b>' + esc(title) + '</b></div>'
      : '<div class="brand"><img src="icons/icon-192.png" alt="">Salle de jeux</div>';
    bar.insertAdjacentHTML("beforeend", '<button type="button" class="skin-btn" aria-label="Changer le style d’affichage"><span aria-hidden="true">🎨</span>Style</button>');
    bar.lastElementChild.onclick = openSheet;
  }

  /* ---------- Choix de l'affichage ---------- */
  const SKINS = [
    { id: "arcade",  em: "🕹️", name: "Arcade",         desc: "Rétro, pixel et BD", sw: "background:#160d2c;color:#ffd23f" },
    { id: "doux",    em: "🌤️", name: "Doux",           desc: "Clair, calme et arrondi", sw: "background:#f6f2ea" },
    { id: "lisible", em: "👓", name: "Lecture facile", desc: "Gros texte, contraste fort", sw: "background:#fff" },
  ];
  function applySkin(id) {
    const el = document.documentElement;
    el.dataset.skin = id;
    el.classList.toggle("calm", id !== "arcade");
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.content = id === "arcade" ? "#160d2c" : id === "doux" ? "#fffaf2" : "#ffffff";
    try { localStorage.setItem("salle-skin", id); } catch (e) {}
    render();
  }
  function showSkinHint() {
    if (lsGet("salle-skin-vu", false) || $("skinHint")) return;
    const d = document.createElement("div");
    d.className = "skin-hint"; d.id = "skinHint"; d.setAttribute("role", "button");
    d.innerHTML = "<b>Nouveau ! 🎨</b>Touche « Style » pour changer l’affichage : plus calme, ou plus facile à lire.";
    d.onclick = openSheet;
    document.body.appendChild(d);
    lsSet("salle-skin-vu", true);
    setTimeout(() => { const x = $("skinHint"); if (x) x.remove(); }, 8000);
  }
  function hideSkinHint() { const d = $("skinHint"); if (d) d.remove(); lsSet("salle-skin-vu", true); }
  function openSheet() {
    hideSkinHint();
    const cur = document.documentElement.dataset.skin;
    const sh = $("sheet"), bg = $("sheetBg");
    sh.innerHTML = '<h3>Affichage</h3><p>Choisis le style qui te convient le mieux.</p>' +
      SKINS.map(s => '<button type="button" class="skin-opt' + (s.id === cur ? ' on' : '') + '" data-id="' + s.id + '">' +
        '<span class="sw" style="' + s.sw + '">' + s.em + '</span><span><b>' + s.name + '</b><small>' + s.desc + '</small></span><span class="ck">✓</span></button>').join("");
    sh.querySelectorAll(".skin-opt").forEach(btn => btn.onclick = () => { applySkin(btn.dataset.id); closeSheet(); });
    bg.classList.add("show"); void sh.offsetHeight; sh.classList.add("show");
    bg.onclick = closeSheet;
  }
  function closeSheet() { $("sheet").classList.remove("show"); $("sheetBg").classList.remove("show"); }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });


  /* ---------- Rendu ---------- */
  function render() {
    const { cls, course, seq, lex } = route();
    document.documentElement.style.setProperty("--c", cls ? cls.color : "");
    view.innerHTML = "";

    // ACCUEIL
    if (!cls) {
      setBar(null);
      document.title = "Salle de jeux";
      view.insertAdjacentHTML("beforeend", '<div class="hero"><div class="press">▶ PRESS START</div><h1>Salut ! 👋</h1><p>Cours, jeux, quiz et fiches de révision. Choisis ta classe !</p></div>');
      const last = lsGet("salle-derniere", null);
      if (last && last.hash) {
        const [c, k, s] = last.hash.replace(/^#/, "").split("/");
        const lc = CLASSES.find(x => x.id === c);
        const ls = s && SEQUENCES.find(x => x.cls === c && x.course === k && x.id === s);
        const valid = lc && (!ls || A.seqState(ETAT, ls) === "ouvert");
        if (valid) {
          const a = document.createElement("a");
          a.className = "resume"; a.href = last.hash; a.style.setProperty("--c", lc.color);
          a.innerHTML = '<span class="ic">' + (last.emoji || "▶️") + '</span><span><small>CONTINUE ?</small><b>' + esc(last.title) + '</b></span><span class="go">›</span>';
          view.appendChild(a);
        }
      }
      const tiles = document.createElement("div"); tiles.className = "tiles";
      for (const c of CLASSES) {
        const n = openRes(visibleRes(resOf(c.id))).length;
        const a = document.createElement("a");
        a.className = "tile"; a.href = "#" + c.id; a.style.setProperty("--c", c.color);
        a.innerHTML = '<div class="em">' + c.emoji + '</div><h2>' + esc(c.name) + '</h2><p>' + esc(c.full) + '</p><span class="n">' + plural(n, "activité") + '</span>';
        tiles.appendChild(a);
      }
      view.appendChild(tiles);
      view.insertAdjacentHTML("beforeend", '<div class="credits">CREDITS : 99 · 1 JOUEUR</div>');
      return;
    }

    // LEXIQUE DE LA CLASSE
    if (lex) { renderLexPage(cls); return; }

    // CLASSE
    if (!course) {
      setBar("#", "Classe", cls.name);
      document.title = cls.name + " · Salle de jeux";
      view.insertAdjacentHTML("beforeend", '<div class="hero"><span class="chip-c">' + esc(cls.name) + '</span><h1>Choisis ton cours</h1><p>' + esc(cls.full) + '</p></div>');
      view.appendChild(list(cls.courses.map(k => {
        const n = openRes(visibleRes(resOf(cls.id, k.id))).length;
        return row({ href: n ? "#" + cls.id + "/" + k.id : null, color: cls.color, emoji: k.emoji, title: k.name, desc: k.sub,
          right: n ? n + " ›" : "Bientôt", soon: !n, onTap: n ? null : () => toast("Rien pour l'instant dans ce cours.") });
      })));
      const nw = (LEX.mots || []).filter(w => w.cls === cls.id && wordOpen(w)).length;
      view.appendChild(sec("📖 Lexique"));
      view.appendChild(list([row({ href: nw ? "#" + cls.id + "/lexique" : null, color: cls.color, emoji: "📖", title: "Lexique " + cls.name,
        desc: "Tous les mots à connaître, avec leur définition", right: nw ? nw + " mots ›" : "Bientôt", soon: !nw,
        onTap: nw ? null : () => toast("Le lexique se remplira au fil des séquences.") })]));
      return;
    }

    // COURS
    if (!seq) {
      setBar("#" + cls.id, cls.name, courseLabel(course));
      document.title = courseLabel(course) + " · " + cls.name;
      lsSet("salle-derniere", { hash: "#" + cls.id + "/" + course.id, title: cls.name + " · " + courseLabel(course), emoji: course.emoji });
      view.insertAdjacentHTML("beforeend", '<div class="hero"><span class="chip-c">' + esc(cls.name) + '</span><h1>' + esc(course.name) + '</h1><p>' + esc(course.sub || "") + '</p></div>');
      const seqs = seqsOf(cls.id, course.id);
      const loose = visibleRes(resOf(cls.id, course.id, null));
      if (!seqs.length && !loose.length) { view.appendChild(empty("Aucune activité pour ce cours pour l'instant.")); return; }
      if (seqs.length) {
        view.appendChild(sec("📚 Séquences"));
        view.appendChild(list(seqs.map(s => {
          const open = A.seqState(ETAT, s) === "ouvert";
          const n = openRes(visibleRes(resOf(cls.id, course.id, s.id))).length;
          if (!open) return row({ color: cls.color, emoji: s.emoji, title: s.name, desc: s.notions, right: "🔒 À venir", off: true,
            onTap: () => toast("Cette séquence n'est pas encore ouverte.") });
          return row({ href: "#" + cls.id + "/" + course.id + "/" + s.id, color: cls.color, emoji: s.emoji, title: s.name,
            desc: s.notions, right: n ? n + " ›" : "Bientôt", soon: !n });
        })));
      }
      view.appendChild(byType(loose));
      const looseIds = loose.map(r => r.id);
      const lw = (LEX.mots || []).filter(w => w.res && looseIds.includes(w.res) && wordOpen(w));
      if (lw.length) view.appendChild(lexBox(lw, "Lexique du cours", resSource));
      return;
    }

    // SÉQUENCE
    setBar("#" + cls.id + "/" + course.id, cls.name + " · " + courseLabel(course), seq.name);
    document.title = seq.name + " · " + cls.name;
    view.insertAdjacentHTML("beforeend", '<div class="hero"><span class="chip-c">' + px("Séquence") + '</span><h1>' + esc(seq.name) + '</h1><p>' + esc(seq.notions || "") + '</p></div>');
    if (A.seqState(ETAT, seq) !== "ouvert") {
      view.appendChild(empty(etatLoaded ? "Cette séquence n'est pas encore ouverte." : "Chargement…"));
      return;
    }
    lsSet("salle-derniere", { hash: "#" + cls.id + "/" + course.id + "/" + seq.id, title: seq.name, emoji: seq.emoji });
    const items = visibleRes(resOf(cls.id, course.id, seq.id));
    if (!items.length) { view.appendChild(empty("Aucune activité dans cette séquence pour l'instant.")); return; }
    view.appendChild(byType(items));
    const ids = items.map(r => r.id), key = A.seqKey(seq);
    const sw = (LEX.mots || []).filter(w => (w.seq === key || (w.res && ids.includes(w.res))) && wordOpen(w));
    if (sw.length) view.appendChild(lexBox(sw, "Lexique de la séquence", (w) => w.res ? resSource(w) : ""));
  }

  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  window.addEventListener("pageshow", (e) => { if (e.persisted) { render(); loadEtat(); loadLex(); } });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadEtat(); loadLex(); } });

  /* ---------- Ajouter à l'écran d'accueil ---------- */
  (function installHint() {
    const box = $("install");
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    if (standalone || lsGet("salle-install-ferme", false)) return;
    let deferred = null;
    const close = '<button type="button" aria-label="Fermer" style="background:none;color:var(--muted);padding:6px;margin-left:4px">✕</button>';
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault(); deferred = e;
      box.innerHTML = '<span style="font-size:24px">📲</span><span><b>Installer l\'appli</b><br>Accès direct depuis ton écran d\'accueil.</span><button type="button" id="inst">Installer</button>' + close;
      box.classList.add("show");
      $("inst").onclick = async () => { deferred.prompt(); await deferred.userChoice; box.classList.remove("show"); };
      box.lastElementChild.onclick = () => { box.classList.remove("show"); lsSet("salle-install-ferme", true); };
    });
    if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
      box.innerHTML = '<span style="font-size:24px">📲</span><span><b>Ajoute-moi à ton écran d\'accueil</b><br>Touche <b>Partager</b> ⎋ puis <b>« Sur l\'écran d\'accueil »</b>.</span>' + close;
      box.classList.add("show");
      box.lastElementChild.onclick = () => { box.classList.remove("show"); lsSet("salle-install-ferme", true); };
    }
  })();

  { const s0 = document.documentElement.dataset.skin; const tc = document.querySelector('meta[name="theme-color"]'); if (tc && s0 !== "arcade") tc.content = s0 === "doux" ? "#fffaf2" : "#ffffff"; }
  setTimeout(showSkinHint, 900);
  if (etatLoaded) render();
  else { setBar(null); view.innerHTML = '<div class="empty">Chargement…</div>'; }
  loadEtat();
  loadLex();
</script>
</body>
</html>
