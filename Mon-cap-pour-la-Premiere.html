<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon cap pour la Première</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Idée : une table de jeu claire en fond, des cartes de verre dépoli, un accent rouge pion et un filet de laiton. */
:root{
  --bg:#e8eeec;
  --surface:rgba(255,255,255,.88);
  --ink:#12201c;
  --muted:#58685f;
  --accent:#2a7f62;
  --accent-dark:#1c5c46;
  --gold:#b58a2e;
  --ok:#1f8a58;
  --ko:#c4452f;
  --line:#d3ddda;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
a{color:var(--accent-dark)}
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(236,242,240,.10) 0%,rgba(236,242,240,.5) 55%,rgba(236,242,240,.85) 100%)}
.wrap{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:18px 16px 56px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 12px;flex-wrap:wrap}
.top>div:first-child{display:contents}
.top .brand{flex:1 1 100%}
.brand{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:22px;height:2px;background:var(--gold);display:block}
.chrono{display:inline-flex;align-items:center;gap:8px;margin:0;padding:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;letter-spacing:.04em}
.chrono::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.keytag{display:flex;align-items:center;gap:5px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(10px)}
.slot{width:13px;height:13px;border-radius:50%;border:1.5px solid #aebdb8;background:transparent}
.slot.on{background:var(--accent);border-color:var(--accent)}
.card{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:26px 22px;box-shadow:0 24px 60px rgba(18,32,28,.14)}
.eyebrow{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark)}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.08;margin:0 0 14px;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:44px}
h2{font-size:28px}
p{margin:0 0 12px}
.phrase{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.28;margin:14px 0 22px;padding:0 0 0 16px;border-left:3px solid var(--gold);text-wrap:balance}
.btn{font:700 16px var(--body);min-height:50px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:#fff;padding:0 24px;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,.opt:focus-visible,.seg:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.link{background:none;border:0;padding:14px 0 0;font:600 15px var(--body);color:var(--accent-dark);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.hint{margin:14px 0 0;padding:12px 14px;background:#fff;border:1px dashed var(--gold);border-radius:12px;font-size:15px}
.fb{border-left:4px solid;padding:12px 14px;margin:14px 0;background:#fff;border-radius:0 12px 12px 0;font-size:16px}
.fb.ok{border-color:var(--ok)}
.fb.ko{border-color:var(--ko)}
.field{display:flex;flex-direction:column;gap:6px;margin:18px 0}
.field label{font-weight:600;font-size:15px}
input[type=text],textarea{font:400 18px var(--body);min-height:50px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
input[type=text]:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:140px;font-size:15px}
.small{font-size:14px;color:var(--muted)}
.line{min-height:66px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1.5px dashed #aebdb8;border-radius:14px;background:#fff;margin:12px 0}
.placeholder{font-size:15px;color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.chip{font:600 16px var(--body);min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-align:left;transition:border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip.placed{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:disabled{opacity:.5;cursor:default}
.ctx{font-size:14px;margin:0 0 4px;color:var(--muted)}
.client{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.3;margin:14px 0 18px;padding:0 0 0 16px;border-left:3px solid var(--gold)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:500 16px var(--body);text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;line-height:1.45;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.good{border-color:var(--ok);background:#e6f4ec}
.opt.bad{border-color:var(--ko);background:#fbe9e5}
.opt:disabled{cursor:default}
.gauge-label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-top:6px;color:var(--muted)}
.gauge{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--ko),var(--gold),var(--ok));background-size:600px 100%;transition:width .4s}
.digit{width:88px;height:108px;display:grid;place-items:center;margin:8px 0 14px;background:var(--accent);color:#fff;border-radius:18px;font-family:var(--display);font-size:64px;font-weight:700}
.pts{font-weight:700;color:var(--accent-dark)}
.code-in{font:700 30px var(--display);letter-spacing:.3em;text-align:center;max-width:320px}
.err{min-height:24px;color:var(--ko);font-weight:600;margin:0 0 8px}
.bulletin{border:1.5px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;background:#fff}
.bulletin dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.bulletin dt{font-weight:600;color:var(--muted)}
.bulletin dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}
.copytext{font-size:14px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;user-select:all;word-break:break-word}
.rules{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 12px}
.rules ul{margin:6px 0 0;padding-left:18px}
.tbl{overflow-x:auto;margin:0 0 16px;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--ink);color:#fff;font-weight:600}
tr:last-child td{border-bottom:0}
.qn{font-weight:700;margin:6px 0 10px}
.wrow{margin:0 0 16px}
.wdef{margin:0 0 6px;font-size:15px}
.wrow input{max-width:280px;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.wrow.ok input{border-color:var(--ok);background:#e6f4ec}
.wmeta{font-size:13px;color:var(--muted);margin-left:8px}
.first{font-family:var(--display);color:var(--accent-dark);font-weight:700}
.mail{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;display:flex;flex-direction:column;gap:4px}
.seg{font:400 15.5px var(--body);text-align:left;background:transparent;border:2px solid transparent;border-radius:10px;padding:7px 9px;color:var(--ink);cursor:pointer;line-height:1.45}
.seg:hover{border-color:var(--line)}
.seg.sel{border-color:var(--gold);background:#fbf3df}
.seg.hit{border-color:var(--ok);background:#e6f4ec}
.seg.bad{border-color:var(--ko);background:#fbe9e5;text-decoration:line-through}
.seg.miss{border:2px dashed var(--ko);background:#fff}
.seg:disabled{cursor:default}
.foot{text-align:center;font-size:13px;color:var(--muted)}
.vlist{padding-left:18px;margin:12px 0}
.vlist li{margin:0 0 6px}
.cd-wrap{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.cd-bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.cd-bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.cd-bar i.low{background:var(--ko)}
.cd{font-variant-numeric:tabular-nums;font-weight:700;min-width:48px;text-align:right}
.ans{max-width:300px;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.tile{width:46px;height:56px;display:grid;place-items:center;background:var(--ink);color:#fff;border-radius:12px;font-family:var(--display);font-size:28px;font-weight:700}
.scene7{margin:8px 0 12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
.scene7 svg{display:block;width:100%;height:auto}
.line.stack{flex-direction:column;align-items:stretch}
.line.stack .chip{width:100%}
select{font:400 16px var(--body);min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.prow{margin:0 0 14px;display:flex;flex-direction:column;gap:6px}
.prow p{margin:0;font-weight:600}
.ok-t{color:var(--ok);font-weight:700}
.ko-t{color:var(--ko);font-weight:700}
.carnet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px;backdrop-filter:blur(10px)}
.carnet summary{cursor:pointer;font-weight:700}
.carnet ol{margin:8px 0 0;padding-left:20px}
.carnet li{margin:0 0 6px}
.ord{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.orow{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px}
.orow .num{font-family:var(--display);font-weight:700;color:var(--accent-dark);min-width:18px}
.orow .tx{flex:1;font-size:16px;line-height:1.4}
.mv{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:16px;cursor:pointer}
.mv:disabled{opacity:.25;cursor:default}
.mv:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.gauge i,.btn,.chip,.opt,.cd-bar i{transition:none}}
@media (max-width:400px){h1{font-size:36px}.card{padding:22px 18px}}

.tbl.nosel,.nosel{user-select:none;-webkit-user-select:none}
.map{margin:8px 0 14px;border-radius:14px;border:1px solid var(--line);background:#fff;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.tbl select{min-height:40px;padding:4px 8px;font-size:15px;min-width:104px}
.tbl td.n{white-space:nowrap}
.items{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.it{border-left:4px solid;padding:9px 12px;background:#fff;border-radius:0 12px 12px 0;font-size:15px}
.it.ok{border-color:var(--ok)}
.it.ko{border-color:var(--ko)}
.it.man{border-color:var(--gold)}
.it small{display:block;color:var(--muted);margin-top:2px}
.stmts{display:flex;flex-direction:column;gap:12px;margin:10px 0}
.stmt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stmt p{margin:0 0 6px;font-size:15.5px}
.facts{display:grid;grid-template-columns:1fr auto;gap:2px 14px;margin:8px 0 12px;font-size:15px}
.facts b{font-variant-numeric:tabular-nums}
.sub{font-weight:700;margin:16px 0 4px}
.rad{border:0;padding:0;margin:14px 0}
.rad legend{font-weight:600;font-size:15px;margin:0 0 8px;padding:0}
.radl{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;cursor:pointer;font-size:15.5px;line-height:1.4}
.radl:has(input:checked){border-color:var(--accent);background:#e6f4ee}
.radl input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.rap{position:sticky;bottom:10px;z-index:5;background:#fff;border:2px solid var(--accent);box-shadow:0 8px 24px rgba(18,32,28,.22);max-height:70vh;overflow:auto;border-radius:16px;padding:6px 14px}
.rap summary{color:var(--accent-dark);font-size:16px;padding:8px 0;text-align:center}
.mini{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid var(--line)}.mini-svg{width:130px;flex:none}.mini-svg svg{display:block;width:100%;height:auto}.mini-t{font-weight:600;font-size:14px}
</style>
</head>

 {v:"A",t:"Recevoir une livraison, vérifier les produits et les ranger."},

 {v:"B",t:"Convaincre un client hésitant de choisir un produit."},

 A:{title:"Mission : magasin de jeux de société",intro:"Lundi, 8 h. Tu travailles dans un magasin de jeux de société. Une palette de nouveautés vient d'arriver et la promotion de Noël commence jeudi.",

function fresh(){return {v:STATE_V,screen:'intro',name:'',t0:null,tEnd:null,step:0,phase:'play',form:{},ord:{},mord:null,log:[],err:''}}

const qSel=(id,lab,arr)=>{const o=S.ord[id]||(S.ord[id]=shuffle(arr.map((_,i)=>i)));return `<fieldset class="rad"><legend>${lab}</legend>${o.map(i=>`<label class="radl"><input type="radio" name="${id}" value="${esc(arr[i])}" ${val(id)===arr[i]?'checked':''}><span>${esc(arr[i])}</span></label>`).join('')}</fieldset>`};
const fixedRad=(id,lab,arr)=>`<fieldset class="rad"><legend>${lab}</legend>${arr.map(x=>`<label class="radl"><input type="radio" name="${id}" value="${esc(x)}" ${val(id)===x?'checked':''}><span>${esc(x)}</span></label>`).join('')}</fieldset>`;
const fTa=(id,lab,rows)=>`<div class="field" style="margin:10px 0"><label for="${id}">${lab}</label><textarea id="${id}" data-f="1" rows="${rows||4}">${esc(val(id))}</textarea></div>`;
const fSel=(id,lab,opts)=>`<div class="field" style="margin:10px 0"><label for="${id}">${lab}</label><select id="${id}" data-f="1">${['—'].concat(opts).map(o=>`<option ${val(id)===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;

/* ordre des missions propre à chaque élève */
const misOrder=()=>S.mord||(S.mord=shuffle(VKEYS));


/* profil */
function profile(){
  const g={A:0,B:0,C:0},n={A:0,B:0,C:0};
  TASTES.forEach((x,i)=>{const a=val('t'+i);n[x.v]++;g[x.v]+=a===LIKE[0]?2:a===LIKE[1]?1:0});
  const out={};
  VKEYS.forEach(v=>{
    const p1=n[v]?g[v]/(2*n[v]):0,r=parseInt(val('rate'+v),10),p2=isNaN(r)?p1:(r-1)/4;
    out[v]=Math.round((0.6*p1+0.4*p2)*100);
  });
  return out;
}
const ranking=()=>[val('c1'),val('c2'),val('c3')];
const topProfile=()=>{const p=profile();return VKEYS.slice().sort((a,b)=>p[b]-p[a])[0]};

function head(){

  return `<div class="top"><div class="brand">Mon cap pour la Première</div><div class="chrono" id="chrono">${fmt(elapsed())}</div><div class="keytag" aria-label="Progression">${slots}</div></div>`;
}

    const opts=VKEYS.map(v=>VN[v]);

  }
  const err=S.err?`<p class="small" style="color:#c0392b"><b>${esc(S.err)}</b></p>`:'';
  return head()+card(`<p class="eyebrow">Étape ${k+1} sur ${NST}</p><h2>${esc(title)}</h2><p>${esc(intro)}</p>${body}${err}<button class="btn" data-act="submit" style="width:100%;margin-top:6px">${k===NST-1?'Terminer':'Valider et continuer'}</button>`)+
  `<details class="carnet rap"><summary>Besoin d'aide ?</summary><p style="margin:8px 0 0">${VKEYS.map(v=>`<b>${esc(VN[v])}</b> : ${esc(VL[v].split(': ')[1]||VL[v])}`).join('<br>')}</p></details>`;

function flags(p,r){const o=VKEYS.slice().sort((a,b)=>p[b]-p[a]),f=[];if(r[0]!==VN[o[0]])f.push('Premier choix différent du profil ('+VN[o[0]]+')');if(p[o[0]]-p[o[1]]<15)f.push('Profil partagé entre '+VN[o[0]]+' et '+VN[o[1]]);if(hesite()==='oui')f.push('L\'élève exprime des hésitations');return f}

function recapHtml(){
  const p=profile(),r=ranking();
  const tastes=TASTES.map((x,i)=>`<tr><td>${esc(VN[x.v])}</td><td>${esc(x.t)}</td><td>${esc(val('t'+i)||'(vide)')}</td></tr>`).join('');
  const mis=VKEYS.map(v=>`<h3>${esc(MIS[v].title)}</h3>`+MIS[v].qs.map(q=>`<p><b>${esc(q.q)}</b><br>${esc(val(q.id)||'(vide)')}</p>`).join('')+`<p>Note : ${esc(val('rate'+v)||'—')} / 5<br>Commentaire : <i>${esc(val('why'+v)||'(vide)')}</i></p>`).join('');
  const vf=VF.map((x,i)=>{const a=val('vf'+i),ok=(a==='Vrai')===x.a&&a!=='';return `<tr><td>${esc(x.t)}</td><td>${esc(a||'(vide)')}</td><td>${ok?'juste':'à revoir'}</td></tr>`}).join('');

function saveForm(){
  document.querySelectorAll('[data-f]').forEach(el=>{S.form[el.id]=el.value});
  document.querySelectorAll('input[type=radio]:checked').forEach(el=>{S.form[el.name]=el.value});

function validate(){
  const k=S.step,miss=id=>!val(id)||val(id)==='—';
  if(k<=1){const o=S.ord.tt.slice(k*12,k*12+12);if(o.some(i=>miss('t'+i)))return "Réponds à toutes les activités."}
  if(k>=2&&k<=4){const v=misOrder()[k-2];if(MIS[v].qs.some(q=>miss(q.id))||miss('rate'+v))return "Réponds aux questions et donne une note.";if(val('why'+v).trim().length<8)return "Écris une phrase sur la mission."}
  if(k===5&&COND.some((_,i)=>miss('cd'+i)))return "Réponds à toutes les lignes.";
  if(k===6&&SKILLS.some((_,i)=>miss('sk'+i)))return "Évalue-toi sur tous les points.";
  if(k===7&&(val('exp1').trim().length<8||val('exp2').trim().length<4||val('exp3').trim().length<4))return "Remplis les trois cases (même une réponse courte).";
  if(k===8&&VF.some((_,i)=>miss('vf'+i)))return "Réponds à toutes les affirmations.";
  if(k===9){const r=ranking();if(r.some(x=>!x||x==='—'))return "Classe les trois voies.";if(new Set(r).size<3)return "Chaque voie doit apparaître une seule fois.";if(val('just').trim().length<40)return "Explique ton choix en 2 phrases au moins."}
  return '';
}
function act(a){
  switch(a){
    case 'start':{const el=document.getElementById('prenom'),n=((el&&el.value)||'').replace(/\|/g,'').trim().slice(0,30);if(!n){el.focus();return}S=fresh();S.name=n;S.t0=Date.now();S.screen='step';break}
    case 'submit':{saveForm();const e=validate();S.err=e;if(e)break;
      if(S.step===8){S.phase='res';break}
      if(S.step===9){S.tEnd=Date.now();S.screen='fin';break}
      S.step++;break}
    case 'next':S.step++;S.phase='play';S.err='';break;
    case 'save':{
      const msg=document.getElementById('savemsg'),nm=(S.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]/g,'')||'eleve'),html=recapHtml();
      (async()=>{try{
        const d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
        if(!d){try{const url=URL.createObjectURL(new Blob([html],{type:'text/html'})),an=document.createElement('a');an.href=url;an.download='Cap-'+nm+'.html';document.body.appendChild(an);an.click();an.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);msg.textContent="Fichier enregistré dans tes téléchargements. Dépose-le sur Pronote."}catch(e2){msg.textContent="Enregistrement impossible. Réessaie."}return}
        await d.save({filename:'Cap-'+nm+'.html',data:new Blob([html],{type:'text/html'})});msg.textContent="Fichier enregistré. Dépose-le sur Pronote.";
      }catch(e){msg.textContent="Enregistrement non effectué. Clique de nouveau sur le bouton."}})();return}
    case 'verify':{
      const L=(document.getElementById('profin').value||'').split('\n').map(l=>l.trim()).filter(Boolean),rows=[],cnt={};
      L.forEach(l=>{const p=l.split('|').map(x=>x.trim());if(p.length<5)return;const ch=p[2].split('>').map(x=>x.trim()),m=p[3].match(/A (\d+)% B (\d+)% Accueil (\d+)%/);if(!m)return;
        const pr={A:+m[1],B:+m[2],C:+m[3]},o=VKEYS.slice().sort((a,b)=>pr[b]-pr[a]),f=[];
        if(ch[0]!==VN[o[0]])f.push('choix ≠ profil');if(pr[o[0]]-pr[o[1]]<15)f.push('profil partagé');if(/oui/.test(p[5]||''))f.push('hésite');
        cnt[ch[0]]=(cnt[ch[0]]||0)+1;rows.push([esc(p[1]),esc(ch[0]),esc(ch[1]||''),esc(ch[2]||''),m[1]+' %',m[2]+' %',m[3]+' %',esc(f.join(', ')||'—')])});
      const sum=Object.keys(cnt).map(k=>`${esc(k)} : ${cnt[k]}`).join(' · ');
      document.getElementById('vres').innerHTML=rows.length?`<p><b>1ers choix :</b> ${sum}</p><div class="tbl"><table><tr><th>Élève</th><th>1er</th><th>2e</th><th>3e</th><th>A</th><th>B</th><th>Acc.</th><th>Attention</th></tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===0?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p>Aucune ligne lisible.</p>';
      return}
    default:return;
  }
  render();
}
$app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act)});
$app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='prenom')act('start')});
window.addEventListener('hashchange',render);
setInterval(()=>{const c=document.getElementById('chrono');if(c&&S.t0&&!S.tEnd)c.textContent=fmt(elapsed())},1000);
function boot(d){if(d&&d.v===STATE_V&&d.screen&&Array.isArray(d.log))S=d;render()}
if(window.claude&&window.claude.hot){window.claude.hot.snapshot(()=>S);window.claude.hot.ready?window.claude.hot.ready(boot):boot(window.claude.hot.data)}else{boot()}
</script></body></html>
