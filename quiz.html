<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz de révision</title>
<meta name="theme-color" content="#1b1640">
<style>
  :root {
    --bg: #f4f1ea; --bg2: #e9e3d6; --ink: #1d1a2e; --muted: #625d75; --card: #ffffff;
    --ok: #1f9d6b; --ok-bg: #e3f6ee; --err: #d23c3c; --err-bg: #fbe7e7; --warn: #e08a00;
    --c: #ff5a36; --shadow: 0 2px 0 rgba(29,26,46,.9);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15122b; --bg2: #1d1940; --ink: #f3efff; --muted: #a9a3c4; --card: #231f47;
      --ok-bg: #173a30; --err-bg: #43202a; --shadow: 0 2px 0 rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(circle at 15% 0%, var(--bg2), transparent 55%), var(--bg);
    color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 680px; margin: 0 auto; padding: 16px 16px 48px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; min-height: 36px; }
  .back {
    display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none;
    border: 2px solid var(--ink); border-radius: 10px; background: var(--card); color: var(--ink);
    text-decoration: none; font-weight: 700; box-shadow: var(--shadow);
  }
  .top .t { font-size: 14px; color: var(--muted); font-weight: 600; line-height: 1.2; }
  .top .t b { color: var(--ink); display: block; font-size: 15px; }
  .top .score { margin-left: auto; font-weight: 800; font-size: 15px; white-space: nowrap; }

  .panel {
    background: var(--card); border: 2px solid var(--ink); border-radius: 18px;
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px;
  }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--c); border: 2px solid var(--c); border-radius: 999px; padding: 4px 12px; margin-bottom: 12px;
  }
  h1 { font-size: clamp(28px, 7vw, 40px); line-height: 1.08; margin: 0 0 10px; letter-spacing: -.02em; }
  .muted { color: var(--muted); }
  .rappel { background: var(--bg2); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin: 14px 0; }
  ul.rules { padding-left: 20px; margin: 10px 0; line-height: 1.6; font-size: 15px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    border: 2px solid var(--ink); border-radius: 14px; background: var(--c); color: #fff;
    font: 800 18px system-ui, sans-serif; padding: 14px 18px; cursor: pointer; box-shadow: var(--shadow);
    text-decoration: none;
  }
  .btn.ghost { background: var(--card); color: var(--ink); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row > * { flex: 1; }

  label.check { display: flex; align-items: center; gap: 10px; font-size: 15px; margin: 14px 0 4px; cursor: pointer; }
  label.check input { width: 22px; height: 22px; accent-color: var(--c); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .stat { background: var(--bg2); border-radius: 12px; padding: 10px 12px; }
  .stat small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
  .stat b { font-size: 22px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 44px; margin-top: 6px; }
  .bars span { flex: 1; background: var(--c); border-radius: 3px 3px 0 0; min-height: 3px; opacity: .85; }

  /* Question */
  .progress { display: flex; gap: 4px; margin-bottom: 12px; }
  .progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--bg2); }
  .progress span.ok { background: var(--ok); } .progress span.ko { background: var(--err); }
  .progress span.half { background: var(--warn); } .progress span.cur { background: var(--c); }

  .timer { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .timer .track { flex: 1; height: 10px; background: var(--bg2); border-radius: 5px; overflow: hidden; }
  .timer .fill { height: 100%; width: 100%; background: var(--ok); border-radius: 5px; transition: background .3s; }
  .timer .fill.mid { background: var(--warn); } .timer .fill.low { background: var(--err); }
  .timer .sec { font: 800 16px ui-monospace, Consolas, monospace; min-width: 48px; text-align: right; }

  .qnum { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .qtext { font-size: 20px; font-weight: 700; line-height: 1.35; margin: 6px 0 4px; }
  .multi { font-size: 13px; font-weight: 700; color: var(--c); margin-bottom: 4px; }

  .choices { display: grid; gap: 10px; margin-top: 14px; }
  .choices.vf { grid-template-columns: 1fr 1fr; }
  .choice {
    display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%;
    background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px;
    padding: 14px; font: 600 16px/1.35 system-ui, sans-serif; cursor: pointer; box-shadow: var(--shadow);
  }
  .choices.vf .choice { justify-content: center; font-size: 18px; font-weight: 800; }
  .choice .l {
    flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--bg2);
    display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;
  }
  .choice.sel { border-color: var(--c); outline: 3px solid var(--c); outline-offset: -1px; }
  .choice.sel .l { background: var(--c); color: #fff; }
  .choice.good { background: var(--ok-bg); border-color: var(--ok); }
  .choice.good .l { background: var(--ok); color: #fff; }
  .choice.bad { background: var(--err-bg); border-color: var(--err); }
  .choice.bad .l { background: var(--err); color: #fff; }
  .choice.dim { opacity: .5; }
  .choice:disabled { cursor: default; }

  .hint-btn {
    margin-top: 14px; background: none; border: 2px dashed var(--muted); color: var(--muted);
    border-radius: 12px; padding: 10px 14px; font: 700 14px system-ui, sans-serif; cursor: pointer; width: 100%;
  }
  .hint { margin-top: 14px; background: var(--bg2); border-radius: 12px; padding: 12px 14px; font-size: 15px; }

  .feedback { border-radius: 14px; padding: 14px; margin-top: 14px; font-size: 15px; line-height: 1.45; }
  .feedback.ok { background: var(--ok-bg); border: 2px solid var(--ok); }
  .feedback.ko { background: var(--err-bg); border: 2px solid var(--err); }
  .feedback b.h { display: block; font-size: 17px; margin-bottom: 4px; }

  /* Résultat */
  .big { font-size: 64px; font-weight: 900; line-height: 1; letter-spacing: -.03em; margin: 8px 0; }
  .big small { font-size: 28px; color: var(--muted); }
  .recap { list-style: none; padding: 0; margin: 0; }
  .recap li { border-top: 1px solid var(--bg2); padding: 12px 0; font-size: 14px; line-height: 1.4; }
  .recap li b { display: block; font-size: 15px; margin-bottom: 2px; }
  .when { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<main id="app"><div class="panel">Chargement du quiz…</div></main>

<script>
(function () {
  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  const qid = params.get("q") || "";

  if (!/^[a-z0-9-]+$/.test(qid)) return fail("Aucun quiz choisi.");
  const s = document.createElement("script");
  s.src = "quizzes/" + qid + ".js";
  s.onload = () => window.QUIZ_DATA ? start(window.QUIZ_DATA) : fail("Ce quiz est vide.");
  s.onerror = () => fail("Ce quiz est introuvable.");
  document.head.appendChild(s);

  function fail(text) {
    app.innerHTML = '<div class="panel"><h1>Oups</h1><p class="muted">' + esc(text) + '</p><a class="btn" href="index.html">Retour à la salle de jeux</a></div>';
  }
  function esc(t) { const d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function fmt(n) { return (Math.round(n * 2) / 2).toString().replace(".", ","); }
  function fmtTime(s) { s = Math.max(0, Math.ceil(s)); const m = Math.floor(s / 60); return m ? m + ":" + String(s % 60).padStart(2, "0") : s + " s"; }

  function start(Q) {
    document.title = "Quiz · " + Q.titre;
    if (Q.couleur) document.documentElement.style.setProperty("--c", Q.couleur);
    const KEY = "quiz-historique:" + Q.id;
    const N = Q.questions.length;
    const PTS = 20 / N;
    const LETTERS = "ABCDEFGH";

    function history() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
    function saveHistory(h) { try { localStorage.setItem(KEY, JSON.stringify(h.slice(-20))); } catch (e) {} }

    function topBar(right) {
      return '<div class="top"><a class="back" href="' + esc(Q.retour || "index.html") + '" aria-label="Retour">←</a>' +
        '<div class="t">' + esc(Q.classe || "Quiz") + '<b>' + esc(Q.titre) + '</b></div>' +
        (right ? '<div class="score">' + right + '</div>' : '') + '</div>';
    }

    function statsHTML(h) {
      if (!h.length) return '<p class="muted" style="margin:14px 0">Première tentative sur cet appareil : bonne chance !</p>';
      const best = Math.max(...h.map(x => x.n));
      const last = h[h.length - 1];
      const bars = h.slice(-10).map(x => '<span title="' + fmt(x.n) + '/20" style="height:' + Math.max(4, x.n / 20 * 100) + '%"></span>').join("");
      return '<div class="stats">' +
        '<div class="stat"><small>Ton record</small><b>' + fmt(best) + '</b>/20</div>' +
        '<div class="stat"><small>Dernière fois</small><b>' + fmt(last.n) + '</b>/20</div>' +
        '<div class="stat" style="grid-column:1/-1"><small>Tes ' + Math.min(10, h.length) + ' dernières tentatives (' + h.length + ' au total)</small><div class="bars">' + bars + '</div></div>' +
        '</div>';
    }

    /* ---------- Écran d'accueil ---------- */
    function intro() {
      const h = history();
      const total = Q.questions.reduce((t, q) => t + (q.temps || 30), 0);
      app.innerHTML = topBar() +
        '<div class="panel">' +
          '<span class="badge">Quiz de révision</span>' +
          '<h1>' + esc(Q.titre) + '</h1>' +
          '<p class="muted">' + N + ' questions · environ ' + Math.round(total / 60) + ' min</p>' +
          (Q.rappel ? '<div class="rappel">📌 ' + esc(Q.rappel) + '</div>' : '') +
          '<ul class="rules">' +
            '<li>⏱️ Chaque question a son propre chrono : plus long pour les calculs.</li>' +
            '<li>✅ Bonne réponse : <b>' + fmt(PTS) + ' pts</b>. Avec l\'indice : <b>' + fmt(PTS / 2) + ' pt' + (PTS / 2 > 1 ? 's' : '') + '</b>.</li>' +
            '<li>⌛ Temps écoulé ou mauvaise réponse : 0 pt.</li>' +
            '<li>🧮 Prépare un brouillon et ta calculatrice.</li>' +
          '</ul>' +
          statsHTML(h) +
          '<label class="check"><input type="checkbox" id="amen"> Temps aménagé (+50 %)</label>' +
          '<div class="row"><button class="btn" id="go">C\'est parti !</button></div>' +
        '</div>';
      document.getElementById("go").onclick = () => run(document.getElementById("amen").checked);
    }

    /* ---------- Déroulé ---------- */
    function run(amenage) {
      const order = Q.melangerQuestions ? shuffle(Q.questions) : Q.questions.slice();
      const results = []; // {status: ok|half|ko|time, got, chosen}
      let i = 0, score = 0, timerId = null;

      function ask() {
        const q = order[i];
        const multi = q.bonnes.length > 1;
        const isVF = q.choix.length === 2 && q.choix.every(c => /^(vrai|faux)$/i.test(c.trim()));
        const display = isVF ? q.choix.map((c, k) => k) : shuffle(q.choix.map((c, k) => k));
        const limit = (q.temps || 30) * (amenage ? 1.5 : 1);
        let usedHint = false, done = false, selected = new Set();

        const prog = order.map((_, k) => {
          const r = results[k];
          const cls = k === i ? "cur" : r ? (r.status === "ok" ? "ok" : r.status === "half" ? "half" : "ko") : "";
          return '<span class="' + cls + '"></span>';
        }).join("");

        app.innerHTML = topBar(fmt(score) + ' pts') +
          '<div class="progress">' + prog + '</div>' +
          '<div class="timer"><div class="track"><div class="fill" id="fill"></div></div><div class="sec" id="sec">' + fmtTime(limit) + '</div></div>' +
          '<div class="panel">' +
            '<div class="qnum">Question ' + (i + 1) + ' / ' + N + '</div>' +
            '<div class="qtext">' + esc(q.q) + '</div>' +
            (multi ? '<div class="multi">☑️ Plusieurs réponses possibles</div>' : '') +
            '<div class="choices' + (isVF ? ' vf' : '') + '" id="choices">' +
              display.map((k, pos) => '<button class="choice" data-k="' + k + '">' + (isVF ? '' : '<span class="l">' + LETTERS[pos] + '</span>') + '<span>' + esc(q.choix[k]) + '</span></button>').join("") +
            '</div>' +
            (multi ? '<div class="row"><button class="btn" id="validate" disabled>Valider</button></div>' : '') +
            (q.indice ? '<button class="hint-btn" id="hintBtn">💡 Voir un indice (la question ne vaudra plus que ' + fmt(PTS / 2) + ' pt' + (PTS / 2 > 1 ? 's' : '') + ')</button>' : '') +
            '<div id="after"></div>' +
          '</div>';
        window.scrollTo(0, 0);

        const fill = document.getElementById("fill"), sec = document.getElementById("sec");
        const buttons = Array.from(document.querySelectorAll(".choice"));
        const t0 = performance.now();

        timerId = setInterval(() => {
          const left = limit - (performance.now() - t0) / 1000;
          const ratio = Math.max(0, left / limit);
          fill.style.width = (ratio * 100) + "%";
          fill.className = "fill" + (ratio < .2 ? " low" : ratio < .5 ? " mid" : "");
          sec.textContent = fmtTime(left);
          if (left <= 0) finish(null);
        }, 100);

        buttons.forEach(b => b.onclick = () => {
          if (done) return;
          const k = +b.dataset.k;
          if (!multi) { finish(new Set([k])); return; }
          selected.has(k) ? selected.delete(k) : selected.add(k);
          b.classList.toggle("sel", selected.has(k));
          document.getElementById("validate").disabled = selected.size === 0;
        });
        if (multi) document.getElementById("validate").onclick = () => finish(selected);

        const hb = document.getElementById("hintBtn");
        if (hb) hb.onclick = () => {
          if (done) return;
          usedHint = true;
          hb.outerHTML = '<div class="hint">💡 ' + esc(q.indice) + '</div>';
        };

        function finish(chosen) {
          if (done) return;
          done = true;
          clearInterval(timerId);
          const good = new Set(q.bonnes);
          const timeout = chosen === null;
          const correct = !timeout && chosen.size === good.size && [...chosen].every(k => good.has(k));
          const got = correct ? (usedHint ? PTS / 2 : PTS) : 0;
          score += got;
          results[i] = { status: timeout ? "time" : correct ? (usedHint ? "half" : "ok") : "ko", got, q };

          buttons.forEach(b => {
            const k = +b.dataset.k;
            b.disabled = true;
            b.classList.remove("sel");
            if (good.has(k)) b.classList.add("good");
            else if (chosen && chosen.has(k)) b.classList.add("bad");
            else b.classList.add("dim");
          });
          const v = document.getElementById("validate"); if (v) v.remove();
          const hb2 = document.getElementById("hintBtn"); if (hb2) hb2.remove();
          document.querySelector(".top .score").textContent = fmt(score) + " pts";

          const head = timeout ? "⌛ Temps écoulé !" : correct ? (usedHint ? "👍 Bonne réponse avec l'indice : +" + fmt(got) + " pt" + (got > 1 ? "s" : "") : "✅ Bonne réponse ! +" + fmt(got) + " pts") : "❌ Raté !";
          const last = i === N - 1;
          document.getElementById("after").innerHTML =
            '<div class="feedback ' + (correct ? "ok" : "ko") + '"><b class="h">' + head + '</b>' +
              (correct ? '' : '<div>Bonne réponse : <b>' + q.bonnes.map(k => esc(q.choix[k])).join(" + ") + '</b></div>') +
              (q.explication ? '<div style="margin-top:6px">' + esc(q.explication) + '</div>' : '') +
            '</div>' +
            '<div class="row"><button class="btn" id="next">' + (last ? "Voir mon résultat 🏁" : "Question suivante →") + '</button></div>';
          const nb = document.getElementById("next");
          nb.scrollIntoView({ behavior: "smooth", block: "nearest" });
          nb.onclick = () => { i++; i < N ? ask() : end(); };
        }
      }

      function end() {
        const prev = history();
        const best = prev.length ? Math.max(...prev.map(x => x.n)) : null;
        const last = prev.length ? prev[prev.length - 1].n : null;
        const note = Math.round(score * 2) / 2;
        const now = new Date();
        prev.push({ d: now.toISOString(), n: note, a: amenage });
        saveHistory(prev);

        const nOk = results.filter(r => r.status === "ok" || r.status === "half").length;
        const mention = note >= 18 ? "🏆 Excellent !" : note >= 14 ? "🎉 Très bien !" : note >= 10 ? "👍 C'est acquis, continue !" : "💪 Revois ta fiche et retente ta chance !";
        let compare = "";
        if (best === null) compare = "C'est ta première tentative sur cet appareil.";
        else if (note > best) compare = "🚀 Nouveau record ! (ancien : " + fmt(best) + "/20)";
        else if (last !== null && note > last) compare = "📈 +" + fmt(note - last) + " pts par rapport à la dernière fois.";
        else if (last !== null && note === last) compare = "➡️ Même note que la dernière fois.";
        else if (last !== null) compare = "📉 " + fmt(note - last) + " pts par rapport à la dernière fois. Ton record reste " + fmt(best) + "/20.";

        const errors = results.filter(r => r.status !== "ok");
        app.innerHTML = topBar() +
          '<div class="panel" style="text-align:center">' +
            '<span class="badge">Résultat</span>' +
            '<div class="big">' + fmt(note) + '<small>/20</small></div>' +
            '<p style="font-size:20px;font-weight:800;margin:6px 0">' + mention + '</p>' +
            '<p class="muted" style="margin:4px 0">' + nOk + ' bonne' + (nOk > 1 ? 's' : '') + ' réponse' + (nOk > 1 ? 's' : '') + ' sur ' + N + '</p>' +
            '<p style="margin:10px 0 0;font-weight:600">' + compare + '</p>' +
            '<p class="when">' + esc(Q.titre) + ' · ' + now.toLocaleDateString("fr-FR") + ' à ' + now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) + (amenage ? ' · temps aménagé' : '') + '</p>' +
            '<div class="row"><button class="btn" id="again">🔁 Recommencer</button></div>' +
            '<div class="row"><a class="btn ghost" href="' + esc(Q.retour || "index.html") + '">← Retour</a></div>' +
          '</div>' +
          (errors.length ? '<div class="panel"><h2 style="margin:0 0 6px;font-size:20px">À revoir</h2><ul class="recap">' +
            errors.map(r => '<li><b>' + (r.status === "time" ? "⌛ " : r.status === "half" ? "💡 " : "❌ ") + esc(r.q.q) + '</b>' +
              'Réponse : ' + r.q.bonnes.map(k => esc(r.q.choix[k])).join(" + ") +
              (r.q.explication ? '<div class="muted" style="margin-top:4px">' + esc(r.q.explication) + '</div>' : '') + '</li>').join("") +
            '</ul></div>' : '');
        document.getElementById("again").onclick = intro;
        window.scrollTo(0, 0);
        if (note >= 14) confetti();
      }

      ask();
    }

    function confetti() {
      const box = document.createElement("div"); box.className = "confetti";
      const colors = ["#ff5a36", "#3b6fe0", "#e8a400", "#1f9d6b", "#d6336c"];
      for (let k = 0; k < 70; k++) {
        const c = document.createElement("i");
        c.style.left = Math.random() * 100 + "%";
        c.style.background = colors[k % colors.length];
        c.style.animationDuration = 1.8 + Math.random() * 1.8 + "s";
        c.style.animationDelay = Math.random() * .6 + "s";
        box.appendChild(c);
      }
      document.body.appendChild(box);
      setTimeout(() => box.remove(), 4500);
    }

    intro();
  }
})();
</script>
</body>
</html>
